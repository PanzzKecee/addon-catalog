<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeoCraft Add-on Minecraft</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#39d67e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NeoCraft Add-on">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%2339d67e' width='100' height='100' rx='20'/><path fill='%231c9c58' d='M20 30h60v40H20z'/><path fill='%23fff' d='M30 40h15v20H30zM50 40h15v20H50zM70 40h10v20H70z'/>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
    :root{
        --bg:#0c0e12; --bg-alt:#15181f; --bg-grid:#101319;
        --panel:#1a1d24; --panel-hi:#20242c;
        --border:#2c313c; --border-hi:#3c4453;
        --text:#eceef2; --text2:#8a91a1; --text3:#565d6b;

        --emerald:#39d67e; --emerald-dk:#1c9c58; --emerald-glow:rgba(57,214,126,.35);
        --diamond:#4fc8e8; --diamond-dk:#2a8fac;
        --amber:#ffb545; --amber-dk:#c98120;
        --redstone:#ff5c5c; --redstone-dk:#c73e3e;
        --lapis:#5b7cfa;

        --radius-notch:10px;
        --font-body:'Inter', system-ui, sans-serif;
        --font-mono:'JetBrains Mono', monospace;
    }
    [data-theme="light"]{
        --bg:#f2f4f7; --bg-alt:#e8ecf1; --bg-grid:#e8ecf1;
        --panel:#ffffff; --panel-hi:#f7f9fc;
        --border:#d0d7e0; --border-hi:#bcc4d0;
        --text:#1d2129; --text2:#5c6573; --text3:#8a94a3;
        --emerald:#28a745; --emerald-dk:#1e7e34; --emerald-glow:rgba(40,167,69,.35);
        --diamond:#0d6efd; --diamond-dk:#0b5ed7;
        --amber:#fd7e14; --amber-dk:#e86c00;
        --redstone:#dc3545; --redstone-dk:#bb2d3b;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{
        font-family:var(--font-body); background:var(--bg); color:var(--text);
        min-height:100vh; padding-bottom:86px; position:relative;
        -webkit-tap-highlight-color:transparent;
    }
    body::before{
        content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
        background-image:
            linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
            linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
        background-size:26px 26px;
        -webkit-mask-image:radial-gradient(ellipse 100% 60% at 50% 0%,#000 0%,transparent 75%);
        mask-image:radial-gradient(ellipse 100% 60% at 50% 0%,#000 0%,transparent 75%);
    }
    ::selection{background:var(--emerald); color:var(--bg);}
    ::-webkit-scrollbar{width:8px;height:8px;}
    ::-webkit-scrollbar-thumb{background:var(--border-hi); border-radius:4px;}

    /* ---------- isometric cube (dipakai di empty state) ---------- */
    .cube{width:22px;height:20px;position:relative;flex-shrink:0;}
    .cube i{position:absolute; width:11px; height:12px;}
    .cube .top{top:0;left:0; background:var(--emerald); clip-path:polygon(50% 0,100% 25%,50% 50%,0 25%); width:22px; height:12px;}
    .cube .left{bottom:0;left:0; background:var(--emerald-dk); clip-path:polygon(0 0,50% 25%,50% 100%,0 75%); width:11px; height:16px;}
    .cube .right{bottom:0;right:0; background:var(--emerald-dk); clip-path:polygon(50% 25%,100% 0,100% 75%,50% 100%); width:11px; height:16px;}
    .cube.spin{animation:cubespin 1.1s linear infinite;}
    @keyframes cubespin{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.06) rotate(3deg)}}

    /* ---------- header ---------- */
    .header{
        background:linear-gradient(180deg,var(--bg-alt, #15181f),var(--bg, #101216) 90%);
        border-bottom:1px solid var(--border);
        padding:16px 18px 14px; position:sticky; top:0; z-index:30;
        backdrop-filter:blur(10px);
    }
    .header-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:8px;}
    .brand{display:flex; align-items:center; gap:11px; min-width:0;}
    .brand h1{
        font-family:var(--font-body); font-weight:800; font-size:16px; letter-spacing:-.5px;
        color:var(--text); line-height:1.3;
    }
    .brand h1 .neo{color:var(--emerald); -webkit-text-fill-color:var(--emerald);}
    .brand h1 .craft{color:#fff; -webkit-text-fill-color:#fff;}
    .brand h1 .sub{display:block; font-size:10px; font-weight:600; color:var(--text3); letter-spacing:1px; text-transform:uppercase; margin-top:2px;}
    .channel-fab{
        position:fixed; right:14px; bottom:calc(100px + env(safe-area-inset-bottom)); z-index:110;
        display:flex; align-items:center; gap:7px; text-decoration:none;
        background:#25D366; color:#fff; border:1px solid #1da851; border-radius:999px;
        padding:9px 16px 9px 13px; font-size:12px; font-weight:700; font-family:var(--font-body);
        text-shadow:0 1px 1.5px rgba(0,0,0,.3);
        box-shadow:0 6px 16px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.3);
        transition:transform .1s ease, box-shadow .1s ease;
        animation:fabFloat 2.8s ease-in-out infinite;
    }
    .channel-fab::before{
        content:''; position:absolute; inset:0; border-radius:999px; background:#25D366;
        z-index:-1; opacity:0; animation:fabPing 2.8s ease-out infinite;
    }
    .channel-fab:active{transform:scale(.9); box-shadow:0 2px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.4); animation:fabPress .12s ease, fabFloat 2.8s ease-in-out infinite;}
    @keyframes fabPress{0%{transform:scale(1); box-shadow:0 6px 16px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.3)} 50%{transform:scale(.88); box-shadow:0 2px 4px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.5)} 100%{transform:scale(.9); box-shadow:0 2px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.4)}}
    @keyframes fabFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes fabPing{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(1.3);opacity:0}}
    .channel-fab svg{flex-shrink:0;}
    .auth-btns{display:flex; gap:8px; align-items:center;}
    .auth-btn{
        padding:8px 14px; font-family:var(--font-body); font-weight:700; font-size:11px;
        letter-spacing:.3px; cursor:pointer; border-radius:7px; color:var(--bg);
        background:var(--emerald); border:1px solid var(--emerald-dk);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 2px 0 var(--emerald-dk);
        transition:transform .08s ease, box-shadow .08s ease;
    }
    .auth-btn.signup{background:var(--diamond); border-color:var(--diamond-dk); box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 2px 0 var(--diamond-dk);}
    .auth-btn:active{transform:translateY(2px); box-shadow:none;}
    .user-chip{display:flex; align-items:center; justify-content:center; gap:8px; font-size:12px; font-weight:600; color:var(--text); min-width:0;}
    .user-chip span:not(.role-tag){overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:140px;}
    .user-chip .role-tag{font-size:9px; font-family:var(--font-mono); font-weight:700; padding:2px 6px; border-radius:4px; background:var(--panel-hi); color:var(--amber); border:1px solid var(--border-hi); flex-shrink:0;}

    @media (max-width: 480px){
        #authBtns{display:none;}
    }

    .search-wrapper{position:relative; max-width:560px; margin:0 auto;}
    .search-wrapper input{
        width:100%; padding:12px 44px 12px 16px; border-radius:9px; font-size:14px;
        background:var(--panel); border:1px solid var(--border); color:var(--text);
        outline:none; font-family:var(--font-body); transition:border-color .15s, box-shadow .15s;
    }
    .search-wrapper input::placeholder{color:var(--text3);}
    .search-wrapper input:focus{border-color:var(--emerald); box-shadow:0 0 0 3px var(--emerald-glow);}
    .search-icon{
        position:absolute; right:14px; top:50%; transform:translateY(-50%);
        color:var(--text3); pointer-events:none; display:flex;
    }
    #advSearchBtn{
        display:flex !important; align-items:center; gap:8px; justify-content:flex-start;
        margin:10px auto 0; padding:6px 10px; background:none; border:none; cursor:pointer;
        border-radius:6px; transition:background .12s;
    }
    #advSearchBtn:hover{background:var(--panel);}
    #advSearchBtn span:first-child{display:flex; flex-direction:column; gap:3px; align-items:flex-start;}
    #advSearchBtn span:first-child span{display:block; height:2px; border-radius:1px; background:var(--diamond);}
    #advSearchBtn span:first-child span:nth-child(1){width:16px;}
    #advSearchBtn span:first-child span:nth-child(2){width:11px;}
    #advSearchBtn span:first-child span:nth-child(3){width:6px;}
    #advLabel{font-size:11px; color:var(--diamond); font-weight:600; letter-spacing:.3px;}
    #advancedSearch{display:none; text-align:center; margin-top:6px;}
    #advancedSearch select{
        padding:9px 14px; border-radius:20px; font-size:12px; margin:4px;
        background:var(--panel); border:1px solid var(--border); color:var(--text);
        font-family:var(--font-body);
    }

    /* ---------- layout ---------- */
    .container{max-width:900px; margin:0 auto; padding:18px 16px; position:relative; z-index:1;}
    .grid{display:flex; flex-wrap:wrap; justify-content:center; gap:14px;}
    .card{width:calc(50% - 7px);}
    @media(min-width:640px){
      .card{width:calc((100% - 28px) / 3); max-width:280px;}
    }

    /* ---------- slot card (signature element) ---------- */
    .card{
        background:var(--panel);
        clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
        box-shadow:
            inset 0 0 0 1px var(--border),
            inset 1px 1px 0 rgba(255,255,255,.05),
            inset -1px -1px 0 rgba(0,0,0,.4);
        overflow:hidden; opacity:0; animation:fadeInUp .45s ease forwards;
        transition:box-shadow .15s ease, transform .12s ease;
        display:flex; flex-direction:column; height:100%; cursor:pointer;
    }
    .card:hover{
        transform:translateY(-2px);
        box-shadow:inset 0 0 0 1px var(--emerald-dk), inset 1px 1px 0 rgba(255,255,255,.08), inset -1px -1px 0 rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
    }
    @keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .card:nth-child(1){animation-delay:.03s}.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.11s}
    .card:nth-child(4){animation-delay:.15s}.card:nth-child(5){animation-delay:.19s}.card:nth-child(6){animation-delay:.23s}
    .card:nth-child(n+7){animation-delay:.26s}
    .card-img{width:100%; aspect-ratio:16/9; object-fit:cover; background:linear-gradient(135deg,var(--bg-alt),var(--bg-grid)); display:block; flex-shrink:0;}
    .card-body{padding:12px 13px 13px; flex:1; display:flex; flex-direction:column;}
    .card-text{height:124px; overflow:hidden;}
    .card-actions{}
    .card-author{font-size:10px; color:var(--diamond); font-weight:600; margin-bottom:4px; font-family:var(--font-mono);}
    .card-title{
        font-size:13.5px; font-weight:700; margin-bottom:6px; line-height:1.3; color:var(--text);
        display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; text-overflow:ellipsis;
    }
    .card-tag{
        display:inline-block; background:rgba(57,214,126,.12); color:var(--emerald);
        font-size:9.5px; font-weight:700; letter-spacing:.4px; padding:3px 8px; border-radius:5px;
        margin-bottom:7px; border:1px solid rgba(57,214,126,.25); font-family:var(--font-mono);
    }
    .card-desc{
        font-size:11.5px; color:var(--text2); margin-bottom:8px; line-height:1.5;
        display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
        overflow:hidden; text-overflow:ellipsis;
    }
    .card-btn{
        display:block; width:100%; padding:10px; color:var(--bg); border:none; border-radius:7px;
        font-size:12px; font-weight:700; cursor:pointer; text-align:center; margin-top:6px;
        font-family:var(--font-body); letter-spacing:.2px; position:relative; overflow:hidden;
        transition:transform .08s ease, filter .1s ease;
    }
    .card-btn:hover{filter:brightness(1.08);}
    .card-btn:active{transform:scale(.96);}
    .card-btn.dl{background:var(--emerald); box-shadow:0 2px 0 var(--emerald-dk);}
    .card-btn.edit{background:var(--diamond); box-shadow:0 2px 0 var(--diamond-dk);}
    .card-btn.delete{background:var(--redstone); color:var(--bg); box-shadow:0 2px 0 var(--redstone-dk);}
    .card-btn.save{background:var(--amber); box-shadow:0 2px 0 var(--amber-dk);}
    .card-btn:active{box-shadow:none; transform:translateY(2px) scale(.98);}
    .card-dl-row{display:flex; gap:6px; margin-top:6px;}
    .card-dl-row .card-btn{margin-top:0; padding:10px 4px;}
    .card-count{
        font-size:10px; color:var(--text3); text-align:center; margin-top:9px; padding-top:9px;
        border-top:1px dashed var(--border); font-family:var(--font-mono);
    }

    /* particle burst on download */
    .burst{position:fixed; width:6px; height:6px; pointer-events:none; z-index:400; border-radius:1px;}

    /* ---------- bottom nav (hotbar) ---------- */
    .navbar{
        position:fixed; bottom:0; left:0; right:0; z-index:100;
        background:linear-gradient(0deg,var(--bg),var(--bg-alt) 90%);
        border-top:1px solid var(--border);
        display:flex; justify-content:center; gap:6px;
        padding:10px 10px calc(10px + env(safe-area-inset-bottom));
    }
    .nav-item{
        font-size:9.5px; color:var(--text3); display:flex; flex-direction:column; align-items:center;
        gap:4px; cursor:pointer; padding:6px 14px 5px; border-radius:8px; position:relative;
        background:var(--panel); border:1px solid transparent; transition:all .12s ease; font-weight:600;
        width:64px;
    }
    .nav-item span{display:flex; pointer-events:none; transition:transform .15s;}
    .nav-item:active{transform:scale(.92);}
    .nav-item.active{color:var(--emerald); border-color:var(--emerald-dk); background:rgba(57,214,126,.08); box-shadow:0 0 0 1px var(--emerald-dk), 0 0 12px rgba(57,214,126,.25);}
    .nav-item.active span{transform:translateY(-1px);}

    /* ---------- modal ---------- */
    .modal-overlay{
        display:none; position:fixed; inset:0; background:rgba(6,7,9,.72); z-index:200;
        align-items:center; justify-content:center; backdrop-filter:blur(3px); padding:20px;
    }
    .modal-overlay.show{display:flex; animation:fadeIn .18s ease;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .modal-box{
        background:var(--panel); padding:22px 20px; width:100%; max-width:380px;
        animation:slideUp .25s cubic-bezier(.2,.8,.3,1.1);
        clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
        box-shadow:inset 0 0 0 1px var(--border-hi), inset 1px 1px 0 rgba(255,255,255,.06), 0 20px 50px rgba(0,0,0,.5);
    }
    @keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    .modal-box h3{margin-bottom:14px; font-size:16px; font-family:var(--font-body); font-weight:700; color:var(--emerald); letter-spacing:0;}
    .modal-box input, .modal-box select, .modal-box textarea{
        width:100%; padding:11px 12px; margin:6px 0; border:1px solid var(--border); border-radius:7px;
        font-size:13px; background:var(--bg); color:var(--text); font-family:var(--font-body); outline:none;
        transition:border-color .12s;
    }
    .modal-box input:focus, .modal-box select:focus, .modal-box textarea:focus{border-color:var(--emerald);}
    .modal-box input::placeholder, .modal-box textarea::placeholder{color:var(--text3);}
    .modal-box small{color:var(--text3); font-size:10px; display:block; margin:-2px 0 6px 2px;}
    .modal-box button{
        width:100%; padding:11px; color:var(--bg); border:none; border-radius:7px; font-size:13px;
        font-weight:700; cursor:pointer; margin-top:7px; font-family:var(--font-body); transition:transform .08s;
    }
    .modal-box button:active{transform:scale(.97);}
    .btn-green{background:var(--emerald); box-shadow:0 2px 0 var(--emerald-dk);}
    .btn-gray{background:var(--panel-hi); color:var(--text2); box-shadow:0 2px 0 var(--bg); border:1px solid var(--border);}
    .btn-google{
        width:100%; padding:11px; border-radius:7px; font-size:13px; font-weight:700; cursor:pointer;
        margin-top:6px; font-family:var(--font-body); background:#fff; color:#1f1f1f; border:1px solid #dadce0;
        box-shadow:0 2px 0 #c8c9cc; display:flex; align-items:center; justify-content:center; gap:10px;
        transition:transform .08s;
    }
    .btn-google:active{transform:scale(.97);}
    .btn-google:disabled{opacity:.7; cursor:default;}
    .auth-divider{display:flex; align-items:center; gap:10px; margin:14px 0 4px; color:var(--text3); font-size:11px;}
    .auth-divider::before, .auth-divider::after{content:''; flex:1; height:1px; background:var(--border);}

    /* ---------- inspect modal (perbesar addon) ---------- */
    .inspect-box{max-width:420px; padding:0; overflow:hidden; max-height:88vh; display:flex; flex-direction:column;}
    .inspect-img-wrap{position:relative; flex-shrink:0;}
    .inspect-img{width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:linear-gradient(135deg,var(--bg-alt),var(--bg-grid));}
    .inspect-body{padding:16px 18px 20px; overflow-y:auto;}
    .inspect-title{font-size:16px; font-weight:800; margin:6px 0 8px; color:var(--text); line-height:1.3;}
    .inspect-desc{font-size:12.5px; color:var(--text2); line-height:1.7; margin:10px 0 16px; white-space:pre-wrap;}

    .no-result{text-align:center; padding:70px 20px; color:var(--text3); width:100%; font-size:13px;}
    .no-result .cube{margin:0 auto 14px;}

    /* ---------- badge notifikasi jumlah pending ---------- */
    .pending-badge{
        position:absolute; top:-7px; right:-7px; background:var(--redstone); color:#2a0808;
        font-size:10px; font-weight:800; min-width:18px; height:18px; border-radius:999px;
        display:inline-flex; align-items:center; justify-content:center; padding:0 4px;
        border:2px solid var(--panel); line-height:1;
    }

    /* ---------- modal persetujuan (mirip list permintaan pertemanan) ---------- */
    .approval-box{max-width:400px; max-height:80vh; display:flex; flex-direction:column;}
    .approval-list{overflow-y:auto; margin:10px 0; display:flex; flex-direction:column; gap:8px;}
    .approval-row{
        display:flex; align-items:center; gap:10px; background:var(--bg-alt); border:1px solid var(--border);
        border-radius:10px; padding:9px 10px;
    }
    .approval-thumb{width:44px; height:44px; border-radius:8px; object-fit:cover; flex-shrink:0; background:linear-gradient(135deg,var(--bg-alt),var(--bg-grid)); border:1px solid var(--border);}
    .approval-info{flex:1; min-width:0;}
    .approval-name{font-size:12.5px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .approval-author{font-size:10.5px; color:var(--text3); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .approval-actions{display:flex; gap:6px; flex-shrink:0;}
    .approval-btn{
        width:32px; height:32px; border-radius:999px; border:none; cursor:pointer; flex-shrink:0;
        display:flex; align-items:center; justify-content:center; transition:transform .1s ease;
    }
    .approval-btn:active{transform:scale(.88);}
    .approval-btn.accept{background:var(--emerald); color:#08110c;}
    .approval-btn.reject{background:var(--redstone); color:#2a0808;}
    .approval-empty{text-align:center; padding:40px 10px; color:var(--text3); font-size:12.5px;}

    .history-list{list-style:none; padding:0;}
    .history-list li{
        background:var(--panel); padding:11px 13px; border-radius:8px; margin-bottom:7px; font-size:12px;
        display:flex; justify-content:space-between; gap:10px; border:1px solid var(--border); color:var(--text2);
    }
    .history-list li span:last-child{color:var(--text3); font-size:10px; font-family:var(--font-mono); white-space:nowrap;}
    h4.section-label{font-family:var(--font-mono); font-size:11px; letter-spacing:.5px; color:var(--text3); margin:16px 0 8px; text-transform:uppercase;}

    .profile-pic{width:96px; height:96px; border-radius:14px; object-fit:cover; border:2px solid var(--border-hi); margin:0 auto 12px; display:block; background:var(--panel-hi);}
    .profile-pic-small{width:28px; height:28px; border-radius:7px; object-fit:cover; border:1px solid var(--border-hi); vertical-align:middle; flex-shrink:0;}

    .profile-block{background:var(--panel); padding:14px; border-radius:10px; margin-bottom:10px; border:1px solid var(--border); text-align:left;}
    .profile-block .row-title{font-size:12.5px; font-weight:700; margin-bottom:8px; color:var(--text);}
    .profile-block small{color:var(--text3); font-size:10px;}

/* ---------- toast ---------- */
    #toastHost{position:fixed; left:0; right:0; bottom:88px; z-index:500; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none;}
    .toast{
        background:var(--panel); border:1px solid var(--border-hi); color:var(--text); font-size:12.5px;
        font-weight:600; padding:11px 18px; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.45);
        animation:toastIn .25s ease, toastOut .25s ease 2.3s forwards; max-width:88vw; text-align:center;
    }
    .toast.err{border-color:var(--redstone);}
    .toast.ok{border-color:var(--emerald);}
    @keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes toastOut{to{opacity:0;transform:translateY(-6px) scale(.97)}}

    /* ---------- skeleton loading ---------- */
    .skeleton{background:linear-gradient(90deg,var(--panel-hi) 25%,var(--border) 50%,var(--panel-hi) 75%); background-size:200% 100%; animation:shimmer 1.2s ease-in-out infinite;}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .sk-card{height:260px; border-radius:var(--radius-notch); clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);}
    .sk-img{height:120px;}
    .sk-title{height:20px; margin:12px 13px 6px; border-radius:4px;}
    .sk-desc{height:12px; margin:0 13px 8px; border-radius:4px;}
    .sk-meta{height:14px; margin:8px 13px; border-radius:4px;}

    /* ---------- focus-visible ---------- */
    :focus:not(:focus-visible){outline:none;}
    :focus-visible{outline:2px solid var(--emerald); outline-offset:2px;}
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--emerald); outline-offset:2px;}

    /* ---------- theme toggle ---------- */
    .theme-toggle{background:var(--panel); border:1px solid var(--border); color:var(--text); width:36px; height:36px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; transition:border-color .15s, background .15s;}
    .theme-toggle:hover{border-color:var(--emerald); background:var(--panel-hi);}
    .theme-toggle:active{transform:scale(.95);}

    /* ---------- share / copy btn ---------- */
    .share-btn{background:var(--panel); border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:7px; font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; font-family:var(--font-body); transition:border-color .15s, background .15s;}
    .share-btn:hover{border-color:var(--emerald); background:var(--panel-hi);}

    /* ---------- skip link (a11y) ---------- */
    .skip-link{position:absolute; top:-100%; left:16px; background:var(--emerald); color:var(--bg); padding:10px 16px; border-radius:6px; font-weight:700; z-index:1000; transition:top .2s;}
    .skip-link:focus{top:16px;}

    /* ---------- PWA install prompt ---------- */
    .install-banner{position:fixed; bottom:100px; left:16px; right:16px; max-width:400px; margin:0 auto; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; box-shadow:0 8px 32px rgba(0,0,0,.4); z-index:150; animation:slideUp .3s ease; display:none;}
    .install-banner.show{display:block;}
    .install-banner p{font-size:13px; color:var(--text2); margin-bottom:12px;}
    .install-banner .btn-row{display:flex; gap:8px;}
    .install-banner .btn-row button{flex:1;}

    /* ---------- reduced motion ---------- */
    @media (prefers-reduced-motion: reduce){
        *, *::before, *::after{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
    }

    /* ---------- print ---------- */
    @media print{.header,.navbar,.channel-fab,.modal-overlay,#toastHost,.skip-link{display:none !important;} body{background:var(--bg); color:var(--text);} .card{break-inside:avoid; box-shadow:none; border:1px solid var(--border);}}
</style>

    // ---------- state (dideklarasikan PALING AWAL, sebelum apa pun yang bisa gagal) ----------

    // ---------- init Firebase (aman: kegagalan tidak menjatuhkan seluruh skrip) ----------
    try {
        if (typeof firebase === 'undefined') throw new Error('SDK Firebase gagal dimuat (cek koneksi internet)');
        firebase.initializeApp({
            apiKey: "AIzaSyAB3iSaswJIjn-LCfvE4EcMpPhlKA0NrJU",
            authDomain: "catalog-50636.firebaseapp.com",
            databaseURL: "https://catalog-50636-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "catalog-50636",
            storageBucket: "catalog-50636.firebasestorage.app",
            messagingSenderId: "968411076830",
            appId: "1:968411076830:web:4b4dd0b969e9e65e718a4f"
        });
        db = firebase.database();
        auth = firebase.auth();
        // paksa sesi login tersimpan permanen di perangkat (LOCAL) -- eksplisit, tidak
        // bergantung pada default browser, supaya tidak ke-logout sendiri tiap buka tab baru.
        try { auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch (e) { console.error('Gagal set persistence:', e); }
        dbReady = true; authReady = true;
    } catch (e) {
        console.error('Firebase gagal diinisialisasi:', e);
        db = null; auth = null; dbReady = false; authReady = false;

    // dipanggil setiap kali mau nulis/baca ke db supaya tidak melempar error kalau db tidak siap
    function withDb(fn) { if (!dbReady || !db) { toast('Offline: perubahan hanya tersimpan di perangkat ini', 'err'); return false; } fn(); return true; }

    // username -> key aman (huruf kecil, alfanumerik + . _ -) dipakai sebagai id node & bagian email semu.
    // Firebase Auth butuh format email, tapi usernya cuma isi Username biasa, jadi kita bikin
    // "email semu" username@panzzaddon.app di belakang layar (tidak pernah dikirim ke mana-mana).
    function usernameKey(u) { return (u || '').toLowerCase().trim().replace(/[^a-z0-9._-]/g, ''); }
    function fakeEmail(key) { return key + '@panzzaddon.app'; }

    function authErrorMsg(err) {
        const c = err && err.code || '';
        if (c === 'auth/wrong-password' || c === 'auth/invalid-credential' || c === 'auth/invalid-login-credentials') return 'Username atau password salah!';
        if (c === 'auth/user-not-found') return 'Username tidak ditemukan!';
        if (c === 'auth/email-already-in-use') return 'Username sudah dipakai!';
        if (c === 'auth/weak-password') return 'Password minimal 6 karakter!';
        if (c === 'auth/too-many-requests') return 'Terlalu banyak percobaan, coba lagi nanti.';
        if (c === 'auth/network-request-failed') return 'Gagal konek ke server, cek koneksi internet.';
        return 'Terjadi kesalahan: ' + (err && err.message ? err.message : String(err));
    }

    // ---------- ikon SVG (pengganti emoji, konsisten di semua perangkat) ----------
    function icn(name, size) {
        size = size || 14;
        const common = `width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2.5px;flex-shrink:0"`;
        const paths = {
            home: `<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/>`,
            clock: `<circle cx="12" cy="12" r="8.5"/><path d="M12 8v4l3 2"/>`,
            list: `<rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>`,
            box: `<path d="M12 3 4 7v10l8 4 8-4V7z"/><path d="M4 7l8 4 8-4M12 11v10"/>`,
            user: `<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/>`,
            search: `<circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.35-4.35"/>`,
            download: `<path d="M12 4v11"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/>`,
            bookmark: `<path d="M7 3.5h10a1 1 0 0 1 1 1V21l-6-4-6 4V4.5a1 1 0 0 1 1-1z"/>`,
            pencil: `<path d="M4 20l1-4L16 5l3 3L8 19l-4 1z"/>`,
            camera: `<path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/>`,
            lock: `<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>`,
            alert: `<path d="M12 3.5 21 19H3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r=".6" fill="currentColor" stroke="none"/>`,
            trash: `<path d="M5 7h14"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M7 7l1 12a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-12"/>`,
crown: `<path d="M4 8l3 3 5-5 5 5 3-3v9H4z"/>`,
            shield: `<path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6z"/>`,
            share: `<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M4 12l6-6 6 6"/><path d="M8 12v8"/><path d="M16 12v8"/>`,
            copy: `<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>`,
            sun: `<circle cx="12" cy="12" r="5"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/>`,
            moon: `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`,
            check: `<path d="M4 12.5l5 5L20 6"/>`,
            x: `<path d="M6 6l12 12M18 6L6 18"/>`
        };
        return `<svg ${common}>${paths[name] || ''}</svg>`;
    }

    // ---------- theme toggle ----------
    function initTheme() {
        const saved = localStorage.getItem('panzz_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        updateThemeIcon(saved);
    }
    function updateThemeIcon(theme) {
        const btn = document.getElementById('themeToggle');
        if (btn) btn.innerHTML = theme === 'dark' ? icn('moon', 18) : icn('sun', 18);
    }
    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('panzz_theme', next);
        updateThemeIcon(next);
    }

    // ---------- native share ----------
    // Ubah data URL (base64) hasil upload thumbnail jadi Blob TANPA lewat network (fetch),
    // supaya cepat dan tidak kena aturan CSP connect-src.
    function dataURLtoBlob(dataUrl) {
        const parts = dataUrl.split(',');
        const mimeMatch = parts[0].match(/data:(.*?);base64/);
        const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
        const bin = atob(parts[1]);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return new Blob([arr], { type: mime });
    }
    async function shareAddon(addon) {
        const baseData = {
            title: addon.name,
            text: addon.desc || 'Cek addon ini!',
            url: window.location.href
        };
        let data = baseData;
        // coba sertakan foto addon-nya juga, kalau ada thumbnail & device/browsernya mendukung
        if (addon.image && addon.image.startsWith('data:') && navigator.canShare) {
            try {
                const blob = dataURLtoBlob(addon.image);
                const ext = (blob.type.split('/')[1] || 'jpg').split('+')[0];
                const fileName = (addon.name || 'addon').replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.' + ext;
                const file = new File([blob], fileName, { type: blob.type });
                const withFile = { ...baseData, files: [file] };
                if (navigator.canShare(withFile)) data = withFile;
            } catch (e) { console.error('Gagal siapkan foto buat share:', e); }
        }
        if (navigator.share && isSecureContext()) {
            try {
                await navigator.share(data);
            } catch (e) {
                if (e.name !== 'AbortError') copyAddonLink(addon);
            }
        } else {
            copyAddonLink(addon);
        }
    }
    function isSecureContext() {
        return window.isSecureContext || location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    }
    function copyAddonLink(addon) {
        const url = window.location.href;
        if (navigator.clipboard && isSecureContext()) {

    function fallbackCopy(text) {

    // particle burst kecil saat tombol ditekan (feedback visual "block break")
    function burst(x, y, color) {
        for (let i = 0; i < 8; i++) {
            const p = document.createElement('div');
            p.className = 'burst';
            p.style.left = x + 'px'; p.style.top = y + 'px'; p.style.background = color;
            document.body.appendChild(p);
            const ang = Math.random() * Math.PI * 2, dist = 18 + Math.random() * 24;
            p.animate([
                { transform: 'translate(0,0) scale(1)', opacity: 1 },
                { transform: `translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px) scale(0)`, opacity: 0 }
            ], { duration: 420 + Math.random() * 150, easing: 'cubic-bezier(.2,.7,.3,1)' });
            setTimeout(() => p.remove(), 600);
        }
    }

    function withTimeout(promise, ms) {
        return Promise.race([
            promise,
            new Promise((_, reject) => setTimeout(() => { const e = new Error('Waktu tunggu habis'); e.code = 'app/timeout'; reject(e); }, ms))
        ]);
    }
    async function handleAuth() {
        const u = document.getElementById('authUser').value.trim(), p = document.getElementById('authPass').value.trim();
        if (!u || !p) { alert('Isi semua!'); return; }
        if (!authReady) { alert('Offline: tidak bisa login/daftar sekarang.'); return; }
        const key = usernameKey(u);
        if (!key) { alert('Username tidak valid!'); return; }
        const email = fakeEmail(key);
        const btn = document.querySelector('#authModal .btn-green');
        if (btn) { btn.disabled = true; btn.textContent = 'Memproses...'; }
        try {
            await withTimeout((async () => {
                if (authMode === 'signup') {
                    const taken = await db.ref('usernames/' + key).once('value');
                    if (taken.exists()) { alert('Username sudah dipakai!'); return; }
                    const cred = await auth.createUserWithEmailAndPassword(email, p);
                    await db.ref('users/' + cred.user.uid).set({ username: u, email });
                    await db.ref('usernames/' + key).set({ uid: cred.user.uid, email });
                    await auth.signOut();
                    toast('Akun dibuat! Silakan Sign In.', 'ok');
                    toggleAuthMode();
                    return;
                }
                // signin: cari email semu dari username dulu
                const snap = await db.ref('usernames/' + key).once('value');
                if (!snap.exists()) { alert('Username tidak ditemukan!'); return; }
                await auth.signInWithEmailAndPassword(snap.val().email, p);
                closeModal('authModal'); toast('Selamat datang, ' + u + '!', 'ok');
            })(), 15000);
        } catch (e) {
            console.error(e);
            if (e && e.code === 'app/timeout') alert('Gagal konek ke server (timeout). Pastikan sudah: 1) aktifkan Email/Password di Firebase Authentication, 2) paste Security Rules di Realtime Database. Lalu coba lagi.');
            else alert(authErrorMsg(e));
        } finally {
            if (btn) { btn.disabled = false; btn.textContent = authMode === 'signin' ? 'Sign In' : 'Sign Up'; }
        }
    }
    function logout() { if (authReady) auth.signOut(); else { currentUser = null; updateUI(); } }

    async function loginWithGoogle() {
        if (!authReady) { alert('Offline: tidak bisa login sekarang.'); return; }
        const btn = document.getElementById('googleBtn');
        const originalHTML = btn ? btn.innerHTML : '';
        if (btn) { btn.disabled = true; btn.innerHTML = 'Memproses...'; }
        try {
            await withTimeout((async () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                const snap = await db.ref('users/' + user.uid).once('value');
                if (!snap.exists()) {
                    // profil baru dari akun Google -> bikin username dari nama Google-nya
                    let base = usernameKey(user.displayName || user.email.split('@')[0]) || 'user';
                    let key = base, n = 1;
                    while ((await db.ref('usernames/' + key).once('value')).exists()) { key = base + n; n++; }
                    await db.ref('users/' + user.uid).set({ username: user.displayName || user.email.split('@')[0], email: user.email, provider: 'google' });
                    await db.ref('usernames/' + key).set({ uid: user.uid, email: user.email });
                }
                // Percobaan otomatis jadi creator/admin. Ini AMAN dibiarkan gagal diam-diam kalau
                // bukan email yang berhak -- keputusan sebenarnya ada di Security Rules server
                // (dicek dari email Google yang sudah diverifikasi), bukan dari kode ini.
                try { await db.ref('users/' + user.uid + '/role').set('creator'); } catch (e) { console.error('Auto-role CREATOR ditolak untuk', user.email, '-', e && e.message); }
                const rsnap = await db.ref('users/' + user.uid + '/role').once('value');
                if (rsnap.val() !== 'creator') {
                    try { await db.ref('users/' + user.uid + '/role').set('admin'); } catch (e) { console.error('Auto-role ADMIN ditolak untuk', user.email, '-', e && e.message); }
                }
                // refresh currentUser lewat fungsi terpusat SEBAGAI LANGKAH TERAKHIR -- ini penting
                // supaya tidak ketiban listener onAuthStateChanged yang bisa jalan lebih dulu/barengan
                // dan menimpa currentUser dengan data lama (race condition).
                await refreshCurrentUserFromServer(user);
                closeModal('authModal'); toast('Selamat datang!', 'ok');
            })(), 20000);
        } catch (e) {
            console.error(e);
            if (e && e.code === 'auth/popup-closed-by-user') { /* user membatalkan, diam saja */ }
            else if (e && e.code === 'app/timeout') alert('Gagal konek ke server (timeout). Coba lagi.');
            else alert(authErrorMsg(e));
        } finally {
            if (btn) { btn.disabled = false; btn.innerHTML = originalHTML; }
        }
    }

    function saveAddon() {
        const name = document.getElementById('addName').value.trim(), imgFile = document.getElementById('addImage').files[0];
        const link1 = document.getElementById('addLink1').value.trim(), link2 = document.getElementById('addLink2').value.trim();
        const desc = document.getElementById('addDesc').value.trim(), tag = document.getElementById('addTag').value;
        if (!name || !link1) { alert('Nama & Link wajib!'); return; }
        if (!isLoggedIn()) { alert('Login dulu!'); return; }
        const btn = document.getElementById('addBtn');
        const originalBtnText = btn ? btn.textContent : '';
        if (btn) { btn.disabled = true; btn.textContent = 'Menyimpan...'; }
        const isMod = isCreator() || isAdmin();
        const editingId = editIndex; // sekarang editIndex menyimpan id (string) addon yang diedit, bukan index array lagi
        function simpan(img) {
            const links = [link1]; if (link2) links.push(link2);
            const existing = editingId ? addons.find(a => a.id === editingId) : null;
            const entry = {
                name, image: img || '', links, desc, tag,
                author: existing ? existing.author : (currentUser?.username || 'anon'),
                authorUid: existing ? (existing.authorUid || currentUser?.uid || null) : (currentUser?.uid || null),
                date: existing ? existing.date : Date.now(),
                status: existing ? existing.status : (isMod ? 'approved' : 'pending')
            };
            if (!dbReady) { toast('Offline: tidak bisa menyimpan sekarang', 'err'); if (btn) { btn.disabled = false; btn.textContent = originalBtnText; } return; }
            const ref = existing ? db.ref('addons/' + existing.id) : db.ref('addons').push();
            ref.set(entry).then(() => {
                closeModal('addModal'); switchTab('my');
                addHistory(existing ? 'Edit' : 'Tambah', name);
                toast(existing ? 'Add-on diperbarui!' : (isMod ? 'Add-on ditambahkan!' : 'Diajukan! Menunggu persetujuan admin.'), 'ok');
            }).catch(err => {
                console.error('Gagal simpan addon ke server:', err);
                toast('Gagal simpan ke server: ' + (err && (err.message || err.code) || 'coba lagi'), 'err');
            }).finally(() => {
                editIndex = -1;
                if (btn) { btn.disabled = false; btn.textContent = originalBtnText; }
            });
        }
        if (imgFile) {
            const r = new FileReader();
            let done = false;
            // pengaman: kalau baca file macet (misalnya file gambar dari sumber yang udah gak valid
            // lagi), jangan biarin nyangkut selamanya -- lanjut simpan tanpa foto setelah 8 detik.
            const existingImg = editingId ? (addons.find(a => a.id === editingId) || {}).image : '';
            const timeoutId = setTimeout(() => {
                if (done) return; done = true;
                toast('Gagal baca foto (coba pilih ulang), add-on disimpan tanpa foto dulu', 'err');
                simpan(existingImg || '');
            }, 8000);
            r.onload = e => { if (done) return; done = true; clearTimeout(timeoutId); simpan(e.target.result); };
            r.onerror = () => { if (done) return; done = true; clearTimeout(timeoutId); toast('Gagal baca foto, coba pilih ulang', 'err'); if (btn) { btn.disabled = false; btn.textContent = originalBtnText; } };
            r.readAsDataURL(imgFile);
        } else {
            const existingImg = editingId ? (addons.find(a => a.id === editingId) || {}).image : '';
            simpan(existingImg || '');
        }
    }

            const adminBtns = (isMod && (isCreator() || currentTab === 'my')) || isOwner ? `<button class="card-btn edit" onclick="event.stopPropagation();openEditForm('${a.id}')">Edit</button><button class="card-btn delete" onclick="event.stopPropagation();deleteAddon('${a.id}')">Hapus</button>` : '';
            const pendingBadge = isPending(a) ? `<span class="card-tag" style="background:rgba(255,181,69,.15);color:var(--amber);border-color:rgba(255,181,69,.3);">Menunggu Persetujuan</span>` : '';
            cards += `<div class="card" data-id="${a.id}">${a.image?`<img class="card-img" src="${a.image}" />`:'<div class="card-img"></div>'}<div class="card-body"><div class="card-text"><div class="card-author">${icn('user',11)} ${a.author||'Anonim'}</div><div class="card-title">${a.name}</div><span class="card-tag">${a.tag||'Add-on'}</span>${pendingBadge}<div class="card-desc">${a.desc||''}</div></div><div class="card-actions">${links}${saveBtn}${removeBtn}${adminBtns}<button class="share-btn" data-action="share" data-id="${a.id}">${icn('share',12)} Share</button><button class="share-btn" data-action="copy" data-id="${a.id}">${icn('copy',12)} Copy</button><div class="card-count">${icn('download',11)} ${downloadCounts[a.name] || 0} download</div></div></div></div>`;
        });
        grid.innerHTML += cards;
    if (!grid.dataset.listenerAdded) {
        grid.addEventListener('click', (e) => {
            const card = e.target.closest('.card[data-id]');
            if (card && !e.target.closest('button, a')) {
                openInspect(card.dataset.id);
            }
            const btn = e.target.closest('.share-btn[data-action]');
            if (btn) {
                e.stopPropagation();
                const a = addons.find(x => x.id === btn.dataset.id);
                if (!a) return;
                if (btn.dataset.action === 'share') shareAddon(a);
                else if (btn.dataset.action === 'copy') copyAddonLink(a);
            }
        });
        grid.dataset.listenerAdded = '1';
    }
    }

    function openInspect(id) {
        const a = addons.find(x => x.id === id); if (!a) return;
        document.getElementById('inspectImg').src = a.image || '';
        document.getElementById('inspectAuthor').innerHTML = `${icn('user',11)} ${a.author||'Anonim'}`;
        document.getElementById('inspectTitle').textContent = a.name;
        document.getElementById('inspectTag').textContent = a.tag || 'Add-on';
        document.getElementById('inspectDesc').textContent = a.desc && a.desc.trim() ? a.desc : '(Tidak ada deskripsi)';
        const links = !a.links || !a.links.length ? '' : a.links.length === 1
            ? `<button class="card-btn dl" onclick="event.stopPropagation();downloadAddon('${a.links[0]}','${a.name}',event)">${icn('download')} Download</button>`
            : `<div class="card-dl-row">${a.links.map((l,j) => `<button class="card-btn dl" onclick="event.stopPropagation();downloadAddon('${l}','${a.name}',event)">${icn('download')} ${j+1}</button>`).join('')}</div>`;
        const shareCopy = `<div style="display:flex;gap:8px;margin-top:8px;">
            <button class="share-btn" data-action="share" data-id="${a.id}">${icn('share',12)} Share</button>
            <button class="share-btn" data-action="copy" data-id="${a.id}">${icn('copy',12)} Copy</button>
        </div>`;
        document.getElementById('inspectDownloads').innerHTML = links + shareCopy;
        document.getElementById('inspectModal').classList.add('show');
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        const el = Array.from(document.querySelectorAll('.nav-item')).find(e => e.textContent.includes(tab === 'all' ? 'All' : tab === 'recent' ? 'Terbaru' : tab === 'history' ? 'History' : tab === 'my' ? 'Addon Saya' : 'Profile'));
        if (el) el.classList.add('active');
        searchInput.value = '';

        const sw = document.querySelector('.search-wrapper'), ab = document.getElementById('advSearchBtn'), as = document.getElementById('advancedSearch');
        if (tab === 'profile') { if (sw) sw.style.display = 'none'; if (ab) ab.style.display = 'none'; if (as) as.style.display = 'none'; }
        else { if (sw) sw.style.display = 'block'; if (ab) ab.style.display = 'flex'; }

        if (tab === 'history') {
            const h = historyList || [], sh = JSON.parse(localStorage.getItem('panzz_searchHistory') || '[]');
            grid.innerHTML = `<div style="width:100%;"><input type="text" id="historySearchInput" placeholder="Cari history..." style="width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;margin-bottom:14px;font-size:13px;background:var(--panel);color:var(--text);" oninput="filterHistory()" /><div id="historyDownloadList"><h4 class="section-label">${icn('download',11)} Download</h4><ul class="history-list">${h.length===0?'<li>Kosong</li>':h.slice(0,20).map(x=>`<li><span>${x.action}: ${x.detail}</span><span>${x.time}</span></li>`).join('')}</ul></div><h4 class="section-label" style="margin-top:18px;">${icn('search',11)} Pencarian</h4><ul class="history-list">${sh.length===0?'<li>Kosong</li>':sh.slice(0,20).map(x=>`<li><span>${x.query}</span><span>${x.time}</span></li>`).join('')}</ul></div>`;
            return;
        }
        if (tab === 'profile') {
            const sp = localStorage.getItem('panzz_pic_'+(currentUser?.username||'')), pic = sp || 'https://placehold.co/96/1a1d24/39d67e?text=%F0%9F%91%A4';
            let p = `<div class="no-result" style="width:100%;padding:20px 10px;"><div style="margin-bottom:14px;"><input type="text" id="searchUserInput" placeholder="Cari username..." style="width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--panel);color:var(--text);" onkeydown="if(event.key==='Enter')searchUser()" /><button class="card-btn dl" style="margin-top:8px;" onclick="searchUser()">${icn('search')} Cari User</button></div><div id="profileContent"><img src="${pic}" class="profile-pic" id="profilePicPreview" /><h3 style="margin-top:12px;font-size:16px;font-weight:700;color:var(--text);">${currentUser?.username||'Guest'}</h3><p style="color:var(--text2);font-size:12px;margin-top:6px;">${getTitle()}</p>`;
            if (isLoggedIn()) {
                const isMod = isCreator() || isAdmin();
                p += `<p style="margin-top:10px;"><button class="card-btn dl" onclick="openModal('add')">${isMod ? '+ Tambah Add-on' : '+ Ajukan Add-on'}</button></p>`;
                if (isMod) {
                    const pendingCount = addons.filter(isPending).length;
                    p += `<p><button class="card-btn edit" onclick="openApprovalModal()" style="position:relative;">${icn('check')} Persetujuan${pendingCount ? `<span class="pending-badge">${pendingCount}</span>` : ''}</button></p>`;
                }
                p += `<p><button class="card-btn edit" onclick="toggleEditProfile()">${icn('pencil')} Edit Profile</button></p>`;
                p += `<div id="editProfileSection" style="display:none;text-align:left;margin-top:16px;">
                    <div class="profile-block"><div style="display:flex;align-items:center;gap:12px;"><img id="editProfilePicPreview" src="${pic}" style="width:50px;height:50px;border-radius:10px;object-fit:cover;border:2px solid var(--emerald);" /><div><div class="row-title">Foto Profil</div><label style="font-size:11px;color:var(--diamond);cursor:pointer;margin-top:2px;display:inline-block;font-weight:600;">${icn('camera')} Pilih Foto<input type="file" id="profilePicInput" accept="image/*" onchange="updateProfilePic()" style="display:none;" /></label></div></div></div>
                    <div class="profile-block"><div class="row-title">${icn('user',12)} Ganti Username</div><div style="display:flex;gap:8px;"><input type="text" id="editUsername" placeholder="Username baru" style="flex:1;" /><button class="card-btn edit" onclick="changeUsername()" style="width:auto;padding:10px 16px;white-space:nowrap;margin-top:0;">Simpan</button></div><small style="margin-top:4px;">Maksimal 1x setiap 24 jam</small></div>
                    <div class="profile-block"><div class="row-title">${icn('lock',12)} Ganti Password</div><input type="password" id="editOldPass" placeholder="Password lama" /><input type="password" id="editNewPass" placeholder="Password baru" /><input type="password" id="editConfirmPass" placeholder="Konfirmasi password baru" /><button class="card-btn save" onclick="changePassword()">Ganti Password</button></div>
                </div>`;
                p += `<p><button class="card-btn delete" onclick="toggleDeleteAccount()">${icn('trash')} Delete Account</button></p>`;
                p += `<div id="deleteAccountSection" style="display:none;text-align:left;margin-top:10px;" class="profile-block"><small>${icn('alert',11)} Masukkan password untuk konfirmasi</small><input type="password" id="deletePass" placeholder="Password" /><button class="card-btn delete" onclick="deleteAccount()">Hapus Akun</button></div>`;
                p += `<p><button class="card-btn delete" onclick="logout()">Logout</button></p>`;
            } else {
                p += `<p style="margin-top:10px;"><button class="card-btn dl" onclick="openModal('signin')">Sign In</button></p><p><button class="card-btn edit" onclick="openModal('signup')">Sign Up</button></p>`;
            }
            p += `</div></div>`; grid.innerHTML = p; return;
        }
        renderGrid();
    }

    function filterHistory() { const q = document.getElementById('historySearchInput').value.toLowerCase(), h = historyList || [], filtered = q ? h.filter(x => (x.detail||'').toLowerCase().includes(q) || (x.action||'').toLowerCase().includes(q)) : h; document.getElementById('historyDownloadList').innerHTML = `<h4 class="section-label">${icn('download',11)} Download</h4><ul class="history-list">${filtered.length===0?'<li>Tidak ditemukan</li>':filtered.slice(0,20).map(x=>`<li><span>${x.action}: ${x.detail}</span><span>${x.time}</span></li>`).join('')}</ul>`; }
    function toggleEditProfile() { const s = document.getElementById('editProfileSection'); s.style.display = s.style.display === 'none' ? 'block' : 'none'; }
    function toggleDeleteAccount() { const s = document.getElementById('deleteAccountSection'); s.style.display = s.style.display === 'none' ? 'block' : 'none'; }
    function updateProfilePic() { const file = document.getElementById('profilePicInput').files[0]; if (!file) return; const r = new FileReader(); r.onload = e => { localStorage.setItem('panzz_pic_'+currentUser.username, e.target.result); const pp = document.getElementById('profilePicPreview'); if (pp) pp.src = e.target.result; const ep = document.getElementById('editProfilePicPreview'); if (ep) ep.src = e.target.result; updateUI(); }; r.readAsDataURL(file); }
    async function changeUsername() {
        if (!isLoggedIn() || !authReady) return; const newUser = document.getElementById('editUsername').value.trim();
        if (!newUser) return alert('Masukkan username baru!');
        const newKey = usernameKey(newUser); if (!newKey) return alert('Username tidak valid!');
        const last = parseInt(localStorage.getItem('panzz_username_change_' + currentUser.uid) || '0');
        if (Date.now() - last < 86400000) { alert('1x/24 jam!'); return; }
        try {
            await withTimeout((async () => {
                const taken = await db.ref('usernames/' + newKey).once('value');
                if (taken.exists()) return alert('Username sudah dipakai!');
                const oldKey = usernameKey(currentUser.username);
                await db.ref('users/' + currentUser.uid + '/username').set(newUser);
                await db.ref('usernames/' + newKey).set({ uid: currentUser.uid, email: currentUser.email });
                await db.ref('usernames/' + oldKey).remove();
                localStorage.setItem('panzz_username_change_' + currentUser.uid, Date.now().toString());
                currentUser.username = newUser; toast('Username diganti!', 'ok'); updateUI();
            })(), 15000);
        } catch (e) { console.error(e); alert(e && e.code === 'app/timeout' ? 'Gagal konek ke server (timeout). Coba lagi.' : authErrorMsg(e)); }
    }
    async function changePassword() {
        const old = document.getElementById('editOldPass').value.trim(), n = document.getElementById('editNewPass').value.trim(), c = document.getElementById('editConfirmPass').value.trim();
        if (!old || !n || !c) return alert('Isi semua!'); if (n !== c) return alert('Password baru tidak cocok!');
        if (n.length < 6) return alert('Password minimal 6 karakter!');
        try {
            await withTimeout((async () => {
                const cred = firebase.auth.EmailAuthProvider.credential(currentUser.email, old);
                await auth.currentUser.reauthenticateWithCredential(cred);
                await auth.currentUser.updatePassword(n);
                toast('Password diganti!', 'ok'); updateUI();
            })(), 15000);
        } catch (e) { console.error(e); alert(e && e.code === 'app/timeout' ? 'Gagal konek ke server (timeout). Coba lagi.' : authErrorMsg(e)); }
    }
    async function deleteAccount() {
        const pass = document.getElementById('deletePass').value.trim(); if (!pass) return alert('Masukkan password!');
        if (!confirm('Yakin hapus akun?')) return;
        try {
            await withTimeout((async () => {
                const cred = firebase.auth.EmailAuthProvider.credential(currentUser.email, pass);
                await auth.currentUser.reauthenticateWithCredential(cred);
                const key = usernameKey(currentUser.username), uid = currentUser.uid, uname = currentUser.username;
                await db.ref('usernames/' + key).remove();
                await db.ref('users/' + uid).remove();
                const ownAddons = addons.filter(a => a.author === uname);
                await Promise.all(ownAddons.map(a => db.ref('addons/' + a.id).remove().catch(() => {})));
                savedAddons = savedAddons.filter(a => a.savedBy !== uname); localStorage.setItem('panzz_saved', JSON.stringify(savedAddons));
                await auth.currentUser.delete();
                toast('Akun dihapus!', 'ok');
            })(), 15000);
        } catch (e) { console.error(e); alert(e && e.code === 'app/timeout' ? 'Gagal konek ke server (timeout). Coba lagi.' : authErrorMsg(e)); }
    }
    async function searchUser() {
        const q = document.getElementById('searchUserInput').value.trim(); if (!q) return alert('Masukkan username!');
        if (!dbReady) return alert('Offline: tidak bisa mencari user sekarang.');
        try {
            await withTimeout((async () => {
                const key = usernameKey(q);
                const mapSnap = await db.ref('usernames/' + key).once('value');
                if (!mapSnap.exists()) { alert('Username tidak ditemukan!'); return; }
                const uid = mapSnap.val().uid;
                const uSnap = await db.ref('users/' + uid).once('value');
                const profile = uSnap.exists() ? uSnap.val() : {};
                const uname = profile.username || q, role = profile.role || 'user';
                const sp = localStorage.getItem('panzz_pic_' + uname), pic = sp || 'https://placehold.co/96/1a1d24/39d67e?text=%F0%9F%91%A4';
                const ua = addons.filter(a => a.author === uname && isApproved(a)), td = ua.reduce((s, a) => s + (a.links || []).length, 0);
                let html = `<img src="${pic}" class="profile-pic" /><h3 style="font-size:16px;font-weight:700;">${uname}</h3><p style="color:var(--text2);font-size:12px;margin-top:6px;">${role === 'creator' ? 'Creator' : role === 'admin' ? 'Admin' : 'User'}</p><p style="font-size:12px;color:var(--text2);margin-top:6px;">${icn('box',11)} ${ua.length} add-on &nbsp; ${icn('download',11)} ${td} download</p>`;
                if (isCreator() && role !== 'creator') html += `<p style="margin-top:10px;"><button class="card-btn delete" onclick="deleteUserAccount('${uid}','${uname}')">${icn('trash')} Hapus Data Akun Ini</button></p>`;
                document.getElementById('profileContent').innerHTML = html;
            })(), 15000);
        } catch (e) { console.error(e); alert(e && e.code === 'app/timeout' ? 'Gagal konek ke server (timeout). Coba lagi.' : authErrorMsg(e)); }
    }
    async function deleteUserAccount(uid, uname) {
        if (!isCreator()) return;
        if (!confirm('Yakin hapus data akun ' + uname + '? (Catatan: ini menghapus data profil & addon-nya. Akun loginnya sendiri baru bisa dihapus total lewat Firebase Console karena batasan keamanan Firebase.)')) return;
        try {
            await withTimeout((async () => {
                const key = usernameKey(uname);
                await db.ref('usernames/' + key).remove();
                await db.ref('users/' + uid).remove();
                const ownAddons = addons.filter(a => a.author === uname);
                await Promise.all(ownAddons.map(a => db.ref('addons/' + a.id).remove().catch(() => {})));
                savedAddons = savedAddons.filter(a => a.savedBy !== uname); localStorage.setItem('panzz_saved', JSON.stringify(savedAddons));
                toast('Data akun ' + uname + ' dihapus!', 'ok'); document.getElementById('profileContent').innerHTML = '<p>Data akun telah dihapus.</p>';
            })(), 15000);
        } catch (e) { console.error(e); alert(e && e.code === 'app/timeout' ? 'Gagal konek ke server (timeout). Coba lagi.' : authErrorMsg(e)); }
    }

    function updateUI() {
        if (isLoggedIn()) {
            const sp = localStorage.getItem('panzz_pic_'+currentUser.username);
            document.getElementById('authBtns').innerHTML = `<div class="user-chip">${sp?`<img src="${sp}" class="profile-pic-small" />`:''}<span>${currentUser.username}</span>${getTitle()!=='User'?`<span class="role-tag">${getTitle()==='Creator'?icn('crown',10)+' CREATOR':icn('shield',10)+' ADMIN'}</span>`:''}</div>`;
        } else {
            document.getElementById('authBtns').innerHTML = '';
        }
        document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
        switchTab(currentTab);
    }

    updateUI();
    initTheme();
    initPWA();
    document.getElementById('inspectModal')?.addEventListener('click', (e) => {
        const btn = e.target.closest('.share-btn[data-action]');
        if (btn) {
            e.stopPropagation();
            const a = addons.find(x => x.id === btn.dataset.id);
            if (!a) return;
            if (btn.dataset.action === 'share') shareAddon(a);
            else if (btn.dataset.action === 'copy') copyAddonLink(a);
        }
    });
</script>
</body>
</html>
