<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panzz Add-on Minecraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
    :root{
        --bg:#0c0e12; --bg-grid:#101319;
        --panel:#1a1d24; --panel-hi:#20242c;
        --border:#2c313c; --border-hi:#3c4453;
        --text:#eceef2; --text2:#8a91a1; --text3:#565d6b;

        --emerald:#39d67e; --emerald-dk:#1c9c58; --emerald-glow:rgba(57,214,126,.35);
        --diamond:#4fc8e8; --diamond-dk:#2a8fac;
        --amber:#ffb545; --amber-dk:#c98120;
        --redstone:#ff5c5c; --redstone-dk:#c73e3e;
        --lapis:#5b7cfa;

        --radius-notch:10px;
        --font-body:'Inter', system-ui, sans-serif;
        --font-mono:'JetBrains Mono', monospace;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{
        font-family:var(--font-body); background:var(--bg); color:var(--text);
        min-height:100vh; padding-bottom:86px; position:relative;
        -webkit-tap-highlight-color:transparent;
    }
    body::before{
        content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
        background-image:
            linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
            linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
        background-size:26px 26px;
        -webkit-mask-image:radial-gradient(ellipse 100% 60% at 50% 0%,#000 0%,transparent 75%);
        mask-image:radial-gradient(ellipse 100% 60% at 50% 0%,#000 0%,transparent 75%);
    }
    ::selection{background:var(--emerald); color:#08110c;}
    ::-webkit-scrollbar{width:8px;height:8px;}
    ::-webkit-scrollbar-thumb{background:var(--border-hi); border-radius:4px;}

    /* ---------- isometric cube (dipakai di empty state) ---------- */
    .cube{width:22px;height:20px;position:relative;flex-shrink:0;}
    .cube i{position:absolute; width:11px; height:12px;}
    .cube .top{top:0;left:0; background:var(--emerald); clip-path:polygon(50% 0,100% 25%,50% 50%,0 25%); width:22px; height:12px;}
    .cube .left{bottom:0;left:0; background:var(--emerald-dk); clip-path:polygon(0 0,50% 25%,50% 100%,0 75%); width:11px; height:16px;}
    .cube .right{bottom:0;right:0; background:#0f7a45; clip-path:polygon(50% 25%,100% 0,100% 75%,50% 100%); width:11px; height:16px;}
    .cube.spin{animation:cubespin 1.1s linear infinite;}
    @keyframes cubespin{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.06) rotate(3deg)}}

    /* ---------- header ---------- */
    .header{
        background:linear-gradient(180deg,#15181f,#101216 90%);
        border-bottom:1px solid var(--border);
        padding:16px 18px 14px; position:sticky; top:0; z-index:30;
        backdrop-filter:blur(10px);
    }
    .header-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
    .brand{display:flex; align-items:center; gap:11px;}
    .brand h1{
        font-family:var(--font-body); font-weight:800; font-size:14px; letter-spacing:-.2px;
        color:var(--text); line-height:1.25;
    }
    .brand h1 span{color:var(--emerald); display:block;}
    .auth-btns{display:flex; gap:8px; align-items:center;}
    .auth-btn{
        padding:8px 14px; font-family:var(--font-body); font-weight:700; font-size:11px;
        letter-spacing:.3px; cursor:pointer; border-radius:7px; color:#08110c;
        background:var(--emerald); border:1px solid var(--emerald-dk);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 2px 0 var(--emerald-dk);
        transition:transform .08s ease, box-shadow .08s ease;
    }
    .auth-btn.signup{background:var(--diamond); border-color:var(--diamond-dk); box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 2px 0 var(--diamond-dk);}
    .auth-btn:active{transform:translateY(2px); box-shadow:none;}
    .user-chip{display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color:var(--text);}
    .user-chip .role-tag{font-size:9px; font-family:var(--font-mono); font-weight:700; padding:2px 6px; border-radius:4px; background:var(--panel-hi); color:var(--amber); border:1px solid var(--border-hi);}

    .search-wrapper{position:relative; max-width:560px; margin:0 auto;}
    .search-wrapper input{
        width:100%; padding:12px 44px 12px 16px; border-radius:9px; font-size:14px;
        background:var(--panel); border:1px solid var(--border); color:var(--text);
        outline:none; font-family:var(--font-body); transition:border-color .15s, box-shadow .15s;
    }
    .search-wrapper input::placeholder{color:var(--text3);}
    .search-wrapper input:focus{border-color:var(--emerald); box-shadow:0 0 0 3px var(--emerald-glow);}
    .search-icon{
        position:absolute; right:14px; top:50%; transform:translateY(-50%);
        color:var(--text3); pointer-events:none; display:flex;
    }
    #advSearchBtn{
        display:flex !important; align-items:center; gap:8px; justify-content:flex-start;
        margin:10px auto 0; padding:6px 10px; background:none; border:none; cursor:pointer;
        border-radius:6px; transition:background .12s;
    }
    #advSearchBtn:hover{background:var(--panel);}
    #advSearchBtn span:first-child{display:flex; flex-direction:column; gap:3px; align-items:flex-start;}
    #advSearchBtn span:first-child span{display:block; height:2px; border-radius:1px; background:var(--diamond);}
    #advSearchBtn span:first-child span:nth-child(1){width:16px;}
    #advSearchBtn span:first-child span:nth-child(2){width:11px;}
    #advSearchBtn span:first-child span:nth-child(3){width:6px;}
    #advLabel{font-size:11px; color:var(--diamond); font-weight:600; letter-spacing:.3px;}
    #advancedSearch{display:none; text-align:center; margin-top:6px;}
    #advancedSearch select{
        padding:9px 14px; border-radius:20px; font-size:12px; margin:4px;
        background:var(--panel); border:1px solid var(--border); color:var(--text);
        font-family:var(--font-body);
    }

    /* ---------- layout ---------- */
    .container{max-width:900px; margin:0 auto; padding:18px 16px; position:relative; z-index:1;}
    .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
    @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);}}

    /* ---------- slot card (signature element) ---------- */
    .card{
        background:var(--panel);
        clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
        box-shadow:
            inset 0 0 0 1px var(--border),
            inset 1px 1px 0 rgba(255,255,255,.05),
            inset -1px -1px 0 rgba(0,0,0,.4);
        overflow:hidden; opacity:0; animation:fadeInUp .45s ease forwards;
        transition:box-shadow .15s ease, transform .12s ease;
        display:flex; flex-direction:column; height:100%; cursor:pointer;
    }
    .card:hover{
        transform:translateY(-2px);
        box-shadow:inset 0 0 0 1px var(--emerald-dk), inset 1px 1px 0 rgba(255,255,255,.08), inset -1px -1px 0 rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
    }
    @keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .card:nth-child(1){animation-delay:.03s}.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.11s}
    .card:nth-child(4){animation-delay:.15s}.card:nth-child(5){animation-delay:.19s}.card:nth-child(6){animation-delay:.23s}
    .card:nth-child(n+7){animation-delay:.26s}
    .card-img{width:100%; aspect-ratio:16/9; object-fit:cover; background:linear-gradient(135deg,#1c2b22,#182022); display:block; flex-shrink:0;}
    .card-body{padding:12px 13px 13px; flex:1; display:flex; flex-direction:column;}
    .card-text{height:124px; overflow:hidden;}
    .card-actions{}
    .card-author{font-size:10px; color:var(--diamond); font-weight:600; margin-bottom:4px; font-family:var(--font-mono);}
    .card-title{
        font-size:13.5px; font-weight:700; margin-bottom:6px; line-height:1.3; color:var(--text);
        display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; text-overflow:ellipsis;
    }
    .card-tag{
        display:inline-block; background:rgba(57,214,126,.12); color:var(--emerald);
        font-size:9.5px; font-weight:700; letter-spacing:.4px; padding:3px 8px; border-radius:5px;
        margin-bottom:7px; border:1px solid rgba(57,214,126,.25); font-family:var(--font-mono);
    }
    .card-desc{
        font-size:11.5px; color:var(--text2); margin-bottom:8px; line-height:1.5;
        display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
        overflow:hidden; text-overflow:ellipsis;
    }
    .card-btn{
        display:block; width:100%; padding:10px; color:#08110c; border:none; border-radius:7px;
        font-size:12px; font-weight:700; cursor:pointer; text-align:center; margin-top:6px;
        font-family:var(--font-body); letter-spacing:.2px; position:relative; overflow:hidden;
        transition:transform .08s ease, filter .1s ease;
    }
    .card-btn:hover{filter:brightness(1.08);}
    .card-btn:active{transform:scale(.96);}
    .card-btn.dl{background:var(--emerald); box-shadow:0 2px 0 var(--emerald-dk);}
    .card-btn.edit{background:var(--diamond); box-shadow:0 2px 0 var(--diamond-dk);}
    .card-btn.delete{background:var(--redstone); color:#2a0808; box-shadow:0 2px 0 var(--redstone-dk);}
    .card-btn.save{background:var(--amber); box-shadow:0 2px 0 var(--amber-dk);}
    .card-btn:active{box-shadow:none; transform:translateY(2px) scale(.98);}
    .card-dl-row{display:flex; gap:6px; margin-top:6px;}
    .card-dl-row .card-btn{margin-top:0; padding:10px 4px;}
    .card-count{
        font-size:10px; color:var(--text3); text-align:center; margin-top:9px; padding-top:9px;
        border-top:1px dashed var(--border); font-family:var(--font-mono);
    }

    /* particle burst on download */
    .burst{position:fixed; width:6px; height:6px; pointer-events:none; z-index:400; border-radius:1px;}

    /* ---------- bottom nav (hotbar) ---------- */
    .navbar{
        position:fixed; bottom:0; left:0; right:0; z-index:100;
        background:linear-gradient(0deg,#101216,#15181f 90%);
        border-top:1px solid var(--border);
        display:flex; justify-content:center; gap:6px;
        padding:10px 10px calc(10px + env(safe-area-inset-bottom));
    }
    .nav-item{
        font-size:9.5px; color:var(--text3); display:flex; flex-direction:column; align-items:center;
        gap:4px; cursor:pointer; padding:6px 14px 5px; border-radius:8px; position:relative;
        background:var(--panel); border:1px solid transparent; transition:all .12s ease; font-weight:600;
        width:64px;
    }
    .nav-item span{display:flex; pointer-events:none; transition:transform .15s;}
    .nav-item:active{transform:scale(.92);}
    .nav-item.active{color:var(--emerald); border-color:var(--emerald-dk); background:rgba(57,214,126,.08); box-shadow:0 0 0 1px var(--emerald-dk), 0 0 12px rgba(57,214,126,.25);}
    .nav-item.active span{transform:translateY(-1px);}

    /* ---------- modal ---------- */
    .modal-overlay{
        display:none; position:fixed; inset:0; background:rgba(6,7,9,.72); z-index:200;
        align-items:center; justify-content:center; backdrop-filter:blur(3px); padding:20px;
    }
    .modal-overlay.show{display:flex; animation:fadeIn .18s ease;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .modal-box{
        background:var(--panel); padding:22px 20px; width:100%; max-width:380px;
        animation:slideUp .25s cubic-bezier(.2,.8,.3,1.1);
        clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
        box-shadow:inset 0 0 0 1px var(--border-hi), inset 1px 1px 0 rgba(255,255,255,.06), 0 20px 50px rgba(0,0,0,.5);
    }
    @keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    .modal-box h3{margin-bottom:14px; font-size:16px; font-family:var(--font-body); font-weight:700; color:var(--emerald); letter-spacing:0;}
    .modal-box input, .modal-box select, .modal-box textarea{
        width:100%; padding:11px 12px; margin:6px 0; border:1px solid var(--border); border-radius:7px;
        font-size:13px; background:var(--bg); color:var(--text); font-family:var(--font-body); outline:none;
        transition:border-color .12s;
    }
    .modal-box input:focus, .modal-box select:focus, .modal-box textarea:focus{border-color:var(--emerald);}
    .modal-box input::placeholder, .modal-box textarea::placeholder{color:var(--text3);}
    .modal-box small{color:var(--text3); font-size:10px; display:block; margin:-2px 0 6px 2px;}
    .modal-box button{
        width:100%; padding:11px; color:#08110c; border:none; border-radius:7px; font-size:13px;
        font-weight:700; cursor:pointer; margin-top:7px; font-family:var(--font-body); transition:transform .08s;
    }
    .modal-box button:active{transform:scale(.97);}
    .btn-green{background:var(--emerald); box-shadow:0 2px 0 var(--emerald-dk);}
    .btn-gray{background:var(--panel-hi); color:var(--text2); box-shadow:0 2px 0 #0c0d10; border:1px solid var(--border);}

    /* ---------- inspect modal (perbesar addon) ---------- */
    .inspect-box{max-width:420px; padding:0; overflow:hidden; max-height:88vh; display:flex; flex-direction:column;}
    .inspect-img-wrap{position:relative; flex-shrink:0;}
    .inspect-img{width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:linear-gradient(135deg,#1c2b22,#182022);}
    .inspect-body{padding:16px 18px 20px; overflow-y:auto;}
    .inspect-title{font-size:16px; font-weight:800; margin:6px 0 8px; color:var(--text); line-height:1.3;}
    .inspect-desc{font-size:12.5px; color:var(--text2); line-height:1.7; margin:10px 0 16px; white-space:pre-wrap;}

    .no-result{text-align:center; padding:70px 20px; color:var(--text3); grid-column:1/-1; font-size:13px;}
    .no-result .cube{margin:0 auto 14px;}

    .history-list{list-style:none; padding:0;}
    .history-list li{
        background:var(--panel); padding:11px 13px; border-radius:8px; margin-bottom:7px; font-size:12px;
        display:flex; justify-content:space-between; gap:10px; border:1px solid var(--border); color:var(--text2);
    }
    .history-list li span:last-child{color:var(--text3); font-size:10px; font-family:var(--font-mono); white-space:nowrap;}
    h4.section-label{font-family:var(--font-mono); font-size:11px; letter-spacing:.5px; color:var(--text3); margin:16px 0 8px; text-transform:uppercase;}

    .profile-pic{width:96px; height:96px; border-radius:14px; object-fit:cover; border:2px solid var(--border-hi); margin:0 auto 12px; display:block; background:var(--panel-hi);}
    .profile-pic-small{width:28px; height:28px; border-radius:7px; object-fit:cover; border:1px solid var(--border-hi); vertical-align:middle;}

    .profile-block{background:var(--panel); padding:14px; border-radius:10px; margin-bottom:10px; border:1px solid var(--border); text-align:left;}
    .profile-block .row-title{font-size:12.5px; font-weight:700; margin-bottom:8px; color:var(--text);}
    .profile-block small{color:var(--text3); font-size:10px;}

    /* ---------- toast ---------- */
    #toastHost{position:fixed; left:0; right:0; bottom:88px; z-index:500; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none;}
    .toast{
        background:var(--panel); border:1px solid var(--border-hi); color:var(--text); font-size:12.5px;
        font-weight:600; padding:11px 18px; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.45);
        animation:toastIn .25s ease, toastOut .25s ease 2.3s forwards; max-width:88vw; text-align:center;
    }
    .toast.err{border-color:var(--redstone);}
    .toast.ok{border-color:var(--emerald);}
    @keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes toastOut{to{opacity:0;transform:translateY(-6px) scale(.97)}}
</style>
</head>
<body>
    <div id="toastHost"></div>

    <div class="header">
        <div class="header-top">
            <div class="brand">
                <div class="cube"><i class="top"></i><i class="left"></i><i class="right"></i></div>
                <h1>Panzz<br><span>Add-on</span></h1>
            </div>
            <div id="authBtns">
                <button class="auth-btn" onclick="openModal('signin')">Sign In</button>
                <button class="auth-btn signup" onclick="openModal('signup')">Sign Up</button>
            </div>
        </div>
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Cari add-on, texture, world..." oninput="searchAddons()" />
            <span class="search-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.35-4.35"/></svg></span>
        </div>
        <button id="advSearchBtn" onclick="toggleAdvancedSearch()">
            <span><span></span><span></span><span></span></span>
            <span id="advLabel">Filter</span>
        </button>
        <div id="advancedSearch">
            <select id="tagFilter" onchange="renderGrid()">
                <option value="">Semua Tag</option>
                <option value="Texture Pack">Texture Pack</option>
                <option value="Add-on">Add-on</option>
                <option value="World">World</option>
                <option value="Skin">Skin</option>
            </select>
        </div>
    </div>

    <div class="container">
        <div class="grid" id="grid"></div>
    </div>

    <div class="navbar">
        <div class="nav-item active" onclick="switchTab('all')"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg></span>All</div>
        <div class="nav-item" onclick="switchTab('recent')"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4l3 2"/></svg></span>Terbaru</div>
        <div class="nav-item" onclick="switchTab('history')"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg></span>History</div>
        <div class="nav-item" onclick="switchTab('my')"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7v10l8 4 8-4V7z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg></span>Addon Saya</div>
        <div class="nav-item" onclick="switchTab('profile')"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></svg></span>Profile</div>
    </div>

    <div class="modal-overlay" id="authModal">
        <div class="modal-box">
            <h3 id="authTitle">Sign In</h3>
            <input type="text" id="authUser" placeholder="Username" />
            <input type="password" id="authPass" placeholder="Password" />
            <button class="btn-green" onclick="handleAuth()">Sign In</button>
            <button class="btn-gray" onclick="toggleAuthMode()">Switch</button>
            <button class="btn-gray" onclick="closeModal('authModal')">Tutup</button>
        </div>
    </div>

    <div class="modal-overlay" id="addModal">
        <div class="modal-box">
            <h3 id="addModalTitle">Tambah Add-on</h3>
            <input type="text" id="addName" placeholder="Nama Add-on" />
            <input type="file" id="addImage" accept="image/*" /><small>Thumbnail</small>
            <input type="text" id="addLink1" placeholder="Link Download (MediaFire)" />
            <input type="text" id="addLink2" placeholder="Link Download 2 (opsional)" />
            <textarea id="addDesc" placeholder="Deskripsi" rows="2"></textarea>
            <select id="addTag">
                <option value="">Pilih Tag</option>
                <option value="Texture Pack">Texture Pack</option>
                <option value="Add-on">Add-on</option>
                <option value="World">World</option>
                <option value="Skin">Skin</option>
            </select>
            <button class="btn-green" id="addBtn" onclick="saveAddon()">Tambah</button>
            <button class="btn-gray" onclick="closeModal('addModal')">Batal</button>
        </div>
    </div>

    <div class="modal-overlay" id="inspectModal" onclick="closeModal('inspectModal')">
        <div class="modal-box inspect-box">
            <div class="inspect-img-wrap">
                <img id="inspectImg" class="inspect-img" src="" />
            </div>
            <div class="inspect-body">
                <div class="card-author" id="inspectAuthor"></div>
                <h3 id="inspectTitle" class="inspect-title"></h3>
                <span class="card-tag" id="inspectTag"></span>
                <p class="inspect-desc" id="inspectDesc"></p>
                <div id="inspectDownloads"></div>
            </div>
        </div>
    </div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
    // ---------- state (dideklarasikan PALING AWAL, sebelum apa pun yang bisa gagal) ----------
    // Ini sengaja ditaruh di atas: kalau skrip Firebase gagal dimuat (offline, adblock, CSP
    // preview, dll), variabel-variabel ini tetap terinisialisasi duluan sehingga semua tombol
    // (buka modal, ganti tab, dsb) tetap berfungsi normal walau sinkronisasi ke server gagal.

    // ---------- toast helper (pengganti alert supaya lebih halus, perilaku sama) ----------
    function toast(msg, type) {
        const host = document.getElementById('toastHost');
        const el = document.createElement('div');
        el.className = 'toast' + (type === 'err' ? ' err' : type === 'ok' ? ' ok' : '');
        el.textContent = msg;
        host.appendChild(el);
        setTimeout(() => el.remove(), 2600);
    }
    function alert(msg) { toast(String(msg)); } // override ringan agar semua alert() lama tampil sebagai toast

    // particle burst kecil saat tombol ditekan (feedback visual "block break")
    function burst(x, y, color) {
        for (let i = 0; i < 8; i++) {
            const p = document.createElement('div');
            p.className = 'burst';
            p.style.left = x + 'px'; p.style.top = y + 'px'; p.style.background = color;
            document.body.appendChild(p);
            const ang = Math.random() * Math.PI * 2, dist = 18 + Math.random() * 24;
            p.animate([
                { transform: 'translate(0,0) scale(1)', opacity: 1 },
                { transform: `translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px) scale(0)`, opacity: 0 }
            ], { duration: 420 + Math.random() * 150, easing: 'cubic-bezier(.2,.7,.3,1)' });
            setTimeout(() => p.remove(), 600);
        }
    }

    function saveAddon() {
        const name = document.getElementById('addName').value.trim(), imgFile = document.getElementById('addImage').files[0];
        const link1 = document.getElementById('addLink1').value.trim(), link2 = document.getElementById('addLink2').value.trim();
        const desc = document.getElementById('addDesc').value.trim(), tag = document.getElementById('addTag').value;
        if (!name || !link1) { alert('Nama & Link wajib!'); return; }
        function simpan(img) {
            const links = [link1]; if (link2) links.push(link2);
            const entry = { name, image: img || '', links, desc, tag, author: editIndex >= 0 ? addons[editIndex].author : (currentUser?.username || 'anon'), date: Date.now() };
            if (editIndex >= 0) addons[editIndex] = entry; else addons.unshift(entry);
            if (dbReady) db.ref('addons').set(addons);
            closeModal('addModal'); switchTab('my'); addHistory(editIndex >= 0 ? 'Edit' : 'Tambah', name); toast(editIndex >= 0 ? 'Add-on diperbarui!' : 'Add-on ditambahkan!', 'ok'); editIndex = -1;
        }
        if (imgFile) { const r = new FileReader(); r.onload = e => simpan(e.target.result); r.readAsDataURL(imgFile); }
        else simpan(editIndex >= 0 ? addons[editIndex].image : '');
    }
    function openEditForm(i) { if (!isCreator()) return; const a = addons[i]; editIndex = i; document.getElementById('addModalTitle').textContent = 'Edit Add-on'; document.getElementById('addBtn').textContent = 'Simpan'; document.getElementById('addName').value = a.name; document.getElementById('addLink1').value = (a.links&&a.links[0])||''; document.getElementById('addLink2').value = (a.links&&a.links[1])||''; document.getElementById('addDesc').value = a.desc||''; document.getElementById('addTag').value = a.tag||''; document.getElementById('addModal').classList.add('show'); }
    function deleteAddon(i) { if (!isCreator()) return; if (!confirm('Hapus?')) return; addons.splice(i,1); if (dbReady) db.ref('addons').set(addons); switchTab('my'); toast('Add-on dihapus', 'ok'); }
    function saveForUser(i) { if (!isLoggedIn()) { alert('Login dulu!'); return; } const a = addons[i]; if (savedAddons.find(s => s.name === a.name && s.links[0] === a.links[0])) { alert('Sudah disimpan!'); return; } savedAddons.unshift({ ...a, savedBy: currentUser.username, savedDate: Date.now() }); localStorage.setItem('panzz_saved', JSON.stringify(savedAddons)); toast('Tersimpan!', 'ok'); switchTab(currentTab); }

    function renderGrid() {
        grid.innerHTML = '';

        if (!newUser) return alert('Masukkan username baru!'); if (users[newUser]) return alert('Username sudah dipakai!');
        const last = parseInt(localStorage.getItem('panzz_username_change_'+currentUser.username)||'0');
        if (Date.now()-last < 86400000) { alert('1x/24 jam!'); return; }
        users[newUser] = { pass: currentUser.pass }; delete users[currentUser.username]; if (dbReady) db.ref('users').set(users);
        localStorage.setItem('panzz_username_change_'+newUser, Date.now().toString());
        currentUser.username = newUser; toast('Username diganti!', 'ok'); updateUI();
    }
    function changePassword() {
        const old = document.getElementById('editOldPass').value.trim(), n = document.getElementById('editNewPass').value.trim(), c = document.getElementById('editConfirmPass').value.trim();
        if (!old||!n||!c) return alert('Isi semua!'); if (old !== currentUser.pass) return alert('Password lama salah!'); if (n !== c) return alert('Password baru tidak cocok!');
        users[currentUser.username].pass = n; if (dbReady) db.ref('users').set(users); currentUser.pass = n; toast('Password diganti!', 'ok'); updateUI();
    }
    function deleteAccount() {
        const pass = document.getElementById('deletePass').value.trim(); if (pass !== currentUser.pass) return alert('Password salah!'); if (!confirm('Yakin hapus akun?')) return;
        delete users[currentUser.username]; addons = addons.filter(a => a.author !== currentUser.username); if (dbReady) { db.ref('users').set(users); db.ref('addons').set(addons); }
        savedAddons = savedAddons.filter(a => a.savedBy !== currentUser.username); localStorage.setItem('panzz_saved', JSON.stringify(savedAddons));
        currentUser = null; toast('Akun dihapus!', 'ok'); updateUI();
    }
    function searchUser() {
        const q = document.getElementById('searchUserInput').value.trim(); if (!q) return alert('Masukkan username!'); if (!users[q]) return alert('Username tidak ditemukan!');
        const sp = localStorage.getItem('panzz_pic_'+q), pic = sp || 'https://placehold.co/96/1a1d24/39d67e?text=%F0%9F%91%A4', ua = addons.filter(a => a.author === q), td = ua.reduce((s,a) => s + (a.links||[]).length, 0);
        const iA = ADMIN_PASSWORDS.includes(users[q].pass), iC = (q === CREATOR_USERNAME && users[q].pass === CREATOR_PASSWORD);
        let html = `<img src="${pic}" class="profile-pic" /><h3 style="font-size:16px;font-weight:700;">${q}</h3><p style="color:var(--text2);font-size:12px;margin-top:6px;">${iC?'Creator':iA?'Admin':'User'}</p><p style="font-size:12px;color:var(--text2);margin-top:6px;">${icn('box',11)} ${ua.length} add-on &nbsp; ${icn('download',11)} ${td} download</p>`;
        if (isCreator() && !iC) html += `<p style="margin-top:10px;"><button class="card-btn delete" onclick="deleteUserAccount('${q}')">${icn('trash')} Hapus Akun Ini</button></p>`;
        document.getElementById('profileContent').innerHTML = html;
    }
    function deleteUserAccount(username) {
        if (!isCreator() || username === CREATOR_USERNAME) return; if (!confirm('Yakin hapus '+username+'?')) return;
        delete users[username]; addons = addons.filter(a => a.author !== username); if (dbReady) { db.ref('users').set(users); db.ref('addons').set(addons); }
        savedAddons = savedAddons.filter(a => a.savedBy !== username); localStorage.setItem('panzz_saved', JSON.stringify(savedAddons));
        toast('Akun '+username+' dihapus!', 'ok'); document.getElementById('profileContent').innerHTML = '<p>Akun telah dihapus.</p>';
    }

    function updateUI() {
        if (isLoggedIn()) {
            const sp = localStorage.getItem('panzz_pic_'+currentUser.username);
            document.getElementById('authBtns').innerHTML = `<div class="user-chip">${sp?`<img src="${sp}" class="profile-pic-small" />`:''}<span>${currentUser.username}</span>${getTitle()!=='User'?`<span class="role-tag">${getTitle()==='Creator'?icn('crown',10)+' CREATOR':icn('shield',10)+' ADMIN'}</span>`:''}</div>`;
        } else {
            document.getElementById('authBtns').innerHTML = `<button class="auth-btn" onclick="openModal('signin')">Sign In</button><button class="auth-btn signup" onclick="openModal('signup')">Sign Up</button>`;
        }
        switchTab(currentTab);
    }

    updateUI();
</script>
</body>
</html>
