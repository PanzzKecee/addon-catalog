<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panzz Add-on Minecraft</title>
    <style>
        :root {
            --bg: #f5f5f5; --card: #ffffff; --text: #1a1a1a; --text2: #666666;
            --accent: #4CAF50; --accent2: #2E7D32; --edit: #2196F3; --delete: #f44336;
            --save: #FF9800; --border: #e0e0e0; --radius: 14px; --shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 70px; }
        .header { background: var(--card); padding: 14px 20px; text-align: center; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 10; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header h1 { font-size: 20px; color: var(--accent2); font-weight: 700; }
        .auth-btns { display: flex; gap: 6px; align-items: center; }
        .auth-btn { padding: 6px 14px; border-radius: 20px; font-size: 11px; cursor: pointer; border: none; color: white; font-weight: 600; background: var(--accent); }
        .auth-btn.signup { background: var(--edit); }
        .search-wrapper { max-width: 450px; margin: 0 auto; position: relative; }
        .search-wrapper input { width: 100%; padding: 12px 18px; border: 2px solid var(--border); border-radius: 25px; font-size: 14px; outline: none; background: var(--bg); }
        .container { max-width: 700px; margin: 0 auto; padding: 16px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; animation: fadeInUp 0.4s ease forwards; opacity: 0; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .card:nth-child(1) { animation-delay: 0.05s; } .card:nth-child(2) { animation-delay: 0.1s; } .card:nth-child(3) { animation-delay: 0.15s; } .card:nth-child(4) { animation-delay: 0.2s; } .card:nth-child(5) { animation-delay: 0.25s; } .card:nth-child(6) { animation-delay: 0.3s; }
        .card-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #e8f5e9; }
        .card-body { padding: 10px 12px 12px; }
        .card-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
        .card-desc { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
        .card-tag { display: inline-block; background: #e8f5e9; color: var(--accent2); font-size: 10px; padding: 2px 8px; border-radius: 10px; margin-bottom: 6px; }
        .card-btn { display: block; width: 100%; padding: 10px; color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; margin-top: 4px; transition: transform 0.1s; }
        .card-btn:active { transform: scale(0.95); }
        .card-btn.dl { background: var(--accent); }
        .card-btn.edit { background: var(--edit); }
        .card-btn.delete { background: var(--delete); }
        .card-btn.save { background: var(--save); }
        .card-count { font-size: 10px; color: var(--text2); text-align: center; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }
        .navbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 10px 0 12px; box-shadow: 0 -2px 8px rgba(0,0,0,0.1); z-index: 100; }
        .nav-item { font-size: 10px; color: var(--text2); display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; transition: transform 0.1s; }
        .nav-item:active { transform: scale(0.9); }
        .nav-item.active { color: var(--accent2); font-weight: 700; }
        .nav-item.active span { transform: translateY(-3px); transition: transform 0.2s ease; }
        .nav-item span { font-size: 20px; pointer-events: none; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-box { background: white; padding: 20px; border-radius: var(--radius); width: 90%; max-width: 380px; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .modal-box h3 { margin-bottom: 10px; font-size: 16px; }
        .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
        .modal-box button { width: 100%; padding: 10px; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 5px; }
        .btn-green { background: var(--accent); }
        .btn-gray { background: #ccc; color: #333; }
        .no-result { text-align: center; padding: 60px 20px; color: var(--text2); grid-column: 1/-1; }
        .history-list { list-style: none; padding: 0; }
        .history-list li { background: var(--card); padding: 10px; border-radius: 8px; margin-bottom: 6px; font-size: 12px; display: flex; justify-content: space-between; box-shadow: var(--shadow); }
        .profile-pic { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #000; margin: 0 auto 10px; display: block; background: #e8f5e9; }
        .profile-pic-small { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 2px solid #000; margin-left: 8px; vertical-align: middle; background: #e8f5e9; }
        #advSearchBtn { display: flex !important; align-items: center; gap: 6px; justify-content: flex-start; margin-left: 0; margin-right: auto; padding: 4px 8px; margin-top: 4px; }
        #advSearchBtn span { display: block; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <h1>Panzz Add-on</h1>
            <div id="authBtns">
                <button class="auth-btn" onclick="openModal('signin')">Sign In</button>
                <button class="auth-btn signup" onclick="openModal('signup')">Sign Up</button>
            </div>
        </div>
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Cari add-on..." oninput="searchAddons()" />
        </div>
        <button id="advSearchBtn" onclick="toggleAdvancedSearch()" style="background:none;border:none;cursor:pointer;padding:4px 8px;margin-top:4px;display:flex;align-items:center;gap:6px;">
            <span style="display:flex;flex-direction:column;gap:3px;align-items:flex-start;">
                <span style="display:block;width:18px;height:3px;background:var(--edit);border-radius:2px;"></span>
                <span style="display:block;width:12px;height:3px;background:var(--edit);border-radius:2px;"></span>
                <span style="display:block;width:6px;height:3px;background:var(--edit);border-radius:2px;"></span>
            </span>
            <span id="advLabel" style="font-size:11px;color:var(--edit);">Filter</span>
        </button>
        <div id="advancedSearch" style="display:none;text-align:center;margin-top:8px;">
            <select id="tagFilter" onchange="renderGrid()" style="padding:8px 12px;border:1px solid var(--border);border-radius:20px;font-size:12px;margin:4px;">
                <option value="">Semua Tag</option>
                <option value="Texture Pack">Texture Pack</option>
                <option value="Add-on">Add-on</option>
                <option value="World">World</option>
                <option value="Skin">Skin</option>
            </select>
        </div>
    </div>
    <div class="container">
        <div class="grid" id="grid"></div>
    </div>
    <div class="navbar">
        <div class="nav-item active" onclick="switchTab('all')"><span>🏠</span>All</div>
        <div class="nav-item" onclick="switchTab('recent')"><span>🕒</span>Terbaru</div>
        <div class="nav-item" onclick="switchTab('history')"><span>📋</span>History</div>
        <div class="nav-item" onclick="switchTab('my')"><span>📦</span>Addon Saya</div>
        <div class="nav-item" onclick="switchTab('profile')"><span>👤</span>Profile</div>
    </div>
    <div class="modal-overlay" id="authModal">
        <div class="modal-box">
            <h3 id="authTitle">Sign In</h3>
            <input type="text" id="authUser" placeholder="Username" />
            <input type="password" id="authPass" placeholder="Password" />
            <button class="btn-green" onclick="handleAuth()">Sign In</button>
            <button class="btn-gray" onclick="toggleAuthMode()">Switch</button>
            <button class="btn-gray" onclick="closeModal('authModal')">Tutup</button>
        </div>
    </div>
    <div class="modal-overlay" id="addModal">
        <div class="modal-box">
            <h3 id="addModalTitle">Tambah Add-on</h3>
            <input type="text" id="addName" placeholder="Nama Add-on" />
            <input type="file" id="addImage" accept="image/*" /><small>Thumbnail</small>
            <input type="text" id="addLink1" placeholder="Link Download (MediaFire)" />
            <input type="text" id="addLink2" placeholder="Link Download 2 (opsional)" />
            <textarea id="addDesc" placeholder="Deskripsi" rows="2"></textarea>
            <select id="addTag">
                <option value="">Pilih Tag</option>
                <option value="Texture Pack">Texture Pack</option>
                <option value="Add-on">Add-on</option>
                <option value="World">World</option>
                <option value="Skin">Skin</option>
            </select>
            <button class="btn-green" id="addBtn" onclick="saveAddon()">Tambah</button>
            <button class="btn-gray" onclick="closeModal('addModal')">Batal</button>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
    firebase.initializeApp({
        apiKey: "AIzaSyAB3iSaswJIjn-LCfvE4EcMpPhlKA0NrJU",
        authDomain: "catalog-50636.firebaseapp.com",
        databaseURL: "https://catalog-50636-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "catalog-50636",
        storageBucket: "catalog-50636.firebasestorage.app",
        messagingSenderId: "968411076830",
        appId: "1:968411076830:web:4b4dd0b969e9e65e718a4f"
    });
    const db = firebase.database();

    const CREATOR_USERNAME = "PanzzKeceeAbis", CREATOR_PASSWORD = "Panzz28072012";
    const ADMIN_PASSWORDS = ["UserAdmin123/--_", CREATOR_PASSWORD];
    let addons = [], savedAddons = [], currentTab = 'all', authMode = 'signin', currentUser = null, editIndex = -1;
    let users = {}, historyList = [], downloadCounts = {};
    currentUser = JSON.parse(localStorage.getItem('panzz_user_simple') || 'null');

    db.ref('addons').on('value', s => { 
    if (s.exists()) {
        const data = s.val();
        // Data udah array, langsung pakai
        addons = Array.isArray(data) ? data : Object.values(data);
    } else {
        addons = [];
    }
    renderGrid();
});

    setTimeout(() => {
        if (addons.length === 0) {
            addons = [
                { name: "Action & Stuff", image: "https://i.postimg.cc/GtBvNw0b/IMG-20260706-WA0103.jpg", links: ["https://www.mediafire.com/file/oufir21241u5xgv/Actions_and_Stuff_1.11_By_Panzz.mcpack/file"], desc: "Animasi player baru", tag: "Add-on", author: "PanzzKeceeAbis", date: Date.now() },
                { name: "More Trees", image: "https://i.postimg.cc/sxF9Mj8K/IMG-20260730-WA0053.jpg", links: ["https://www.mediafire.com/file/rjg3aauezana7gg/More_Trees_By_Panzz.mcaddon/file"], desc: "Tambahan pohon", tag: "Add-on", author: "PanzzKeceeAbis", date: Date.now() }
            ];
            db.ref('addons').set(addons);
        }
    }, 3000);

    historyList = JSON.parse(localStorage.getItem('panzz_history') || '[]');
    savedAddons = JSON.parse(localStorage.getItem('panzz_saved') || '[]');

    const isLoggedIn = () => !!currentUser;
    function isAdmin() { return currentUser && ADMIN_PASSWORDS.includes(currentUser.pass) && !(currentUser.username === CREATOR_USERNAME && currentUser.pass === CREATOR_PASSWORD); }
    function isCreator() { return currentUser && currentUser.username === CREATOR_USERNAME && currentUser.pass === CREATOR_PASSWORD; }
    function getTitle() { if (isCreator()) return 'Creator'; if (isAdmin()) return 'Admin'; return 'User'; }

    function addHistory(action, detail) { historyList.unshift({ action, detail, time: new Date().toLocaleString() }); if (historyList.length > 50) historyList.pop(); localStorage.setItem('panzz_history', JSON.stringify(historyList)); }
    function addSearchHistory(q) { if (!q || !q.trim()) return; const sh = JSON.parse(localStorage.getItem('panzz_searchHistory') || '[]'); sh.unshift({ query: q.trim(), time: new Date().toLocaleString() }); if (sh.length > 30) sh.pop(); localStorage.setItem('panzz_searchHistory', JSON.stringify(sh)); }
    function addCount(id) { downloadCounts[id] = (downloadCounts[id] || 0) + 1; db.ref('downloadCounts/' + id).set(downloadCounts[id]); }

    function openModal(type) {
        if (type === 'signin' || type === 'signup') {
            authMode = type;
            document.getElementById('authTitle').textContent = type === 'signin' ? 'Sign In' : 'Sign Up';
            document.getElementById('authModal').classList.add('show');
        } else if (type === 'add') {
    editIndex = -1;
    document.getElementById('addModalTitle').textContent = 'Tambah Add-on';
    document.getElementById('addBtn').textContent = 'Tambah';
    document.getElementById('addName').value = '';
    document.getElementById('addImage').value = '';
    document.getElementById('addLink1').value = '';
    document.getElementById('addLink2').value = '';
    document.getElementById('addDesc').value = '';
    document.getElementById('addTag').value = '';
    document.getElementById('addModal').classList.add('show');
}
    }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }
    function toggleAuthMode() { authMode = authMode === 'signin' ? 'signup' : 'signin'; document.getElementById('authTitle').textContent = authMode === 'signin' ? 'Sign In' : 'Sign Up'; }
    function handleAuth() {
        const u = document.getElementById('authUser').value.trim(), p = document.getElementById('authPass').value.trim();
        if (!u || !p) { alert('Isi semua!'); return; }
        if (authMode === 'signup') { if (users[u]) { alert('Username sudah dipakai!'); return; } users[u] = { pass: p }; db.ref('users/' + u).set({ pass: p }); alert('Akun dibuat!'); toggleAuthMode(); return; }
        if (!users[u] || users[u].pass !== p) { alert('Username atau password salah!'); return; }
        currentUser = { username: u, pass: p };
        localStorage.setItem('panzz_user_simple', JSON.stringify(currentUser));
        closeModal('authModal'); updateUI();
    }
    function logout() { currentUser = null; localStorage.removeItem('panzz_user_simple'); updateUI(); }

    function saveAddon() {
    const name = document.getElementById('addName').value.trim();
    const imgFile = document.getElementById('addImage').files[0];
    const link1 = document.getElementById('addLink1').value.trim();
    const link2 = document.getElementById('addLink2').value.trim();
    const desc = document.getElementById('addDesc').value.trim();
    const tag = document.getElementById('addTag').value;
    
    if (!name || !link1) { alert('Nama & Link wajib!'); return; }
    
    function simpan(img) {
        const links = [link1]; if (link2) links.push(link2);
        const entry = { name, image: img || '', links, desc, tag, author: currentUser?.username || 'anon', date: Date.now() };
        
        // PAKE PUSH biar ga numpuk
        db.ref('addons').push(entry)
            .then(() => {
                closeModal('addModal');
                switchTab('my');
                alert('Add-on ditambahkan!');
            })
            .catch(err => {
                alert('Gagal: ' + err.message);
            });
    }
    
    if (imgFile) { const r = new FileReader(); r.onload = e => simpan(e.target.result); r.readAsDataURL(imgFile); }
    else simpan('');
}
    function openEditForm(i) { if (!isCreator()) return; const a = addons[i]; editIndex = i; document.getElementById('addModalTitle').textContent = 'Edit Add-on'; document.getElementById('addBtn').textContent = 'Simpan'; document.getElementById('addName').value = a.name; document.getElementById('addLink1').value = (a.links&&a.links[0])||''; document.getElementById('addLink2').value = (a.links&&a.links[1])||''; document.getElementById('addDesc').value = a.desc||''; document.getElementById('addTag').value = a.tag||''; document.getElementById('addModal').classList.add('show'); }
    function deleteAddon(i) { if (!isCreator()) return; if (!confirm('Hapus?')) return; addons.splice(i,1); db.ref('addons').set(addons); switchTab('my'); }
    function saveForUser(i) { if (!isLoggedIn()) { alert('Login dulu!'); return; } const a = addons[i]; if (savedAddons.find(s => s.name === a.name && s.links[0] === a.links[0])) { alert('Sudah disimpan!'); return; } savedAddons.unshift({ ...a, savedBy: currentUser.username, savedDate: Date.now() }); localStorage.setItem('panzz_saved', JSON.stringify(savedAddons)); alert('Tersimpan!'); switchTab(currentTab); }
    function removeSaved(i) { savedAddons.splice(i,1); localStorage.setItem('panzz_saved', JSON.stringify(savedAddons)); switchTab('my'); }

    function downloadAddon(link, name) { addCount(name); addHistory('Download', name); window.open(link, '_blank'); setTimeout(renderGrid, 500); }
            const grid = document.getElementById('grid'), searchInput = document.getElementById('searchInput');

        function searchAddons() { const q = searchInput.value.trim(); if (q) addSearchHistory(q); renderGrid(); }
        function toggleAdvancedSearch() { const adv = document.getElementById('advancedSearch'), label = document.getElementById('advLabel'); if (adv.style.display === 'none' || adv.style.display === '') { adv.style.display = 'block'; if (label) label.textContent = 'Tutup'; } else { adv.style.display = 'none'; if (label) label.textContent = 'Filter'; document.getElementById('tagFilter').value = ''; renderGrid(); } }

        function renderGrid() {
            grid.innerHTML = '';
            const f = searchInput.value.toLowerCase(), tagF = document.getElementById('tagFilter')?.value || '';
            let list = [...addons];
            if (currentTab === 'recent') list = list.slice(0,5);
            if (currentTab === 'my') {
                if (!isLoggedIn()) { grid.innerHTML = '<div class="no-result">Login dulu.</div>'; return; }
                if (isAdmin() || isCreator()) grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;margin-bottom:12px;"><button class="card-btn save" onclick="openModal(\'add\')">+ Tambah Add-on</button></div>';
                list = (isAdmin() || isCreator()) ? addons.filter(a => a.author === currentUser.username) : savedAddons.filter(a => a.savedBy === currentUser.username);
            }
            if (f) list = list.filter(a => a.name.toLowerCase().includes(f) || (a.desc||'').toLowerCase().includes(f));
            if (tagF) list = list.filter(a => (a.tag||'') === tagF);
            if (!list.length) { grid.innerHTML += '<div class="no-result">Kosong</div>'; return; }
            let cards = '';
            list.forEach((a,i) => {
                const idx = addons.indexOf(a);
                const links = (a.links||[]).map((l,j) => `<button class="card-btn dl" onclick="downloadAddon('${l}','${a.name}')">📥 Download ${a.links.length>1?j+1:''}</button>`).join('');
                const saveBtn = (!isAdmin() && !isCreator() && isLoggedIn() && currentTab !== 'my') ? `<button class="card-btn save" onclick="saveForUser(${idx})">💾 Simpan</button>` : '';
                const removeBtn = (!isAdmin() && !isCreator() && currentTab === 'my') ? `<button class="card-btn delete" onclick="removeSaved(${i})">Hapus</button>` : '';
                const adminBtns = (isCreator()) ? `<button class="card-btn edit" onclick="openEditForm(${idx})">Edit</button><button class="card-btn delete" onclick="deleteAddon(${idx})">Hapus</button>` : (isAdmin() && currentTab === 'my') ? `<button class="card-btn edit" onclick="openEditForm(${idx})">Edit</button><button class="card-btn delete" onclick="deleteAddon(${idx})">Hapus</button>` : '';
                cards += `<div class="card">${a.image?`<img class="card-img" src="${a.image}" />`:''}<div class="card-body"><div style="font-size:10px;color:var(--edit);text-align:left;margin-bottom:2px;">👤 ${a.author||'Anonim'}</div><div class="card-title">${a.name}</div><span class="card-tag">${a.tag||''}</span><div class="card-desc">${a.desc||''}</div>${links}${saveBtn}${removeBtn}${adminBtns}<div class="card-count">📥 ${downloadCounts[a.name] || 0} download</div></div></div>`;
            });
            grid.innerHTML += cards;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            const el = Array.from(document.querySelectorAll('.nav-item')).find(e => e.textContent.includes(tab === 'all' ? 'All' : tab === 'recent' ? 'Terbaru' : tab === 'history' ? 'History' : tab === 'my' ? 'Addon Saya' : 'Profile'));
            if (el) el.classList.add('active');
            searchInput.value = '';

            const sw = document.querySelector('.search-wrapper'), ab = document.getElementById('advSearchBtn'), as = document.getElementById('advancedSearch');
            if (tab === 'profile') { if (sw) sw.style.display = 'none'; if (ab) ab.style.display = 'none'; if (as) as.style.display = 'none'; }
            else { if (sw) sw.style.display = 'block'; if (ab) ab.style.display = 'flex'; }

            if (tab === 'history') {
                const h = historyList || [], sh = JSON.parse(localStorage.getItem('panzz_searchHistory') || '[]');
                grid.innerHTML = `<div style="grid-column:1/-1;"><input type="text" id="historySearchInput" placeholder="Cari history..." style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px;font-size:13px;" oninput="filterHistory()" /><div id="historyDownloadList"><h4>📥 Download</h4><ul class="history-list">${h.length===0?'<li>Kosong</li>':h.slice(0,20).map(x=>`<li><span>${x.action}: ${x.detail}</span><span style="font-size:10px;">${x.time}</span></li>`).join('')}</ul></div><h4 style="margin-top:16px;">🔍 Pencarian</h4><ul class="history-list">${sh.length===0?'<li>Kosong</li>':sh.slice(0,20).map(x=>`<li><span>${x.query}</span><span style="font-size:10px;">${x.time}</span></li>`).join('')}</ul></div>`;
                return;
            }
            if (tab === 'profile') {
                const sp = localStorage.getItem('panzz_pic_'+(currentUser?.username||'')), pic = sp || 'https://placehold.co/80/4CAF50/white?text=👤';
                let p = `<div class="no-result" style="grid-column:1/-1;"><div style="margin-bottom:12px;"><input type="text" id="searchUserInput" placeholder="Cari username..." style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:13px;" onkeydown="if(event.key==='Enter')searchUser()" /><button class="card-btn dl" style="margin-top:6px;" onclick="searchUser()">🔍 Cari User</button></div><div id="profileContent"><img src="${pic}" class="profile-pic" /><h3 style="margin-top:12px;">${currentUser?.username||'Guest'}</h3><p>${getTitle()}</p>`;
                if (isLoggedIn()) {
                    p += `<p><button class="card-btn dl" onclick="openModal('add')">+ Tambah Add-on</button></p>`;
                    p += `<p><button class="card-btn edit" onclick="toggleEditProfile()">✏️ Edit Profile</button></p>`;
                    p += `<div id="editProfileSection" style="display:none;text-align:left;margin-top:16px;">
                        <div style="background:var(--card);padding:14px;border-radius:var(--radius);margin-bottom:8px;"><div style="display:flex;align-items:center;gap:12px;"><img id="editProfilePicPreview" src="${pic}" style="width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);" /><div><div style="font-size:13px;font-weight:600;">Foto Profil</div><label style="font-size:11px;color:var(--edit);cursor:pointer;margin-top:2px;display:inline-block;">📷 Pilih Foto<input type="file" id="profilePicInput" accept="image/*" onchange="updateProfilePic()" style="display:none;" /></label></div></div></div>
                        <div style="background:var(--card);padding:14px;border-radius:var(--radius);margin-bottom:8px;"><div style="font-size:13px;font-weight:600;margin-bottom:6px;">👤 Ganti Username</div><div style="display:flex;gap:8px;"><input type="text" id="editUsername" placeholder="Username baru" style="flex:1;" /><button class="card-btn edit" onclick="changeUsername()" style="width:auto;padding:10px 16px;white-space:nowrap;">Simpan</button></div><div style="font-size:10px;color:var(--text2);margin-top:4px;">Maksimal 1x setiap 24 jam</div></div>
                        <div style="background:var(--card);padding:14px;border-radius:var(--radius);"><div style="font-size:13px;font-weight:600;margin-bottom:8px;">🔐 Ganti Password</div><input type="password" id="editOldPass" placeholder="Password lama" /><input type="password" id="editNewPass" placeholder="Password baru" /><input type="password" id="editConfirmPass" placeholder="Konfirmasi password baru" /><button class="card-btn save" onclick="changePassword()">Ganti Password</button></div>
                    </div>`;
                    p += `<p><button class="card-btn delete" onclick="toggleDeleteAccount()">🗑️ Delete Account</button></p>`;
                    p += `<div id="deleteAccountSection" style="display:none;text-align:left;margin-top:10px;background:var(--card);padding:12px;border-radius:var(--radius);"><small>⚠️ Masukkan password untuk konfirmasi</small><input type="password" id="deletePass" placeholder="Password" /><button class="card-btn delete" onclick="deleteAccount()">Hapus Akun</button></div>`;
                    p += `<p><button class="card-btn delete" onclick="logout()">Logout</button></p>`;
                } else {
                    p += `<p><button class="card-btn dl" onclick="openModal('signin')">Sign In</button></p><p><button class="card-btn edit" onclick="openModal('signup')">Sign Up</button></p>`;
                }
                p += `</div></div>`; grid.innerHTML = p; return;
            }
            renderGrid();
        }

        function filterHistory() { const q = document.getElementById('historySearchInput').value.toLowerCase(), h = historyList || [], filtered = q ? h.filter(x => (x.detail||'').toLowerCase().includes(q) || (x.action||'').toLowerCase().includes(q)) : h; document.getElementById('historyDownloadList').innerHTML = `<h4>📥 Download</h4><ul class="history-list">${filtered.length===0?'<li>Tidak ditemukan</li>':filtered.slice(0,20).map(x=>`<li><span>${x.action}: ${x.detail}</span><span style="font-size:10px;">${x.time}</span></li>`).join('')}</ul>`; }
        function toggleEditProfile() { const s = document.getElementById('editProfileSection'); s.style.display = s.style.display === 'none' ? 'block' : 'none'; }
        function toggleDeleteAccount() { const s = document.getElementById('deleteAccountSection'); s.style.display = s.style.display === 'none' ? 'block' : 'none'; }
        function updateProfilePic() { const file = document.getElementById('profilePicInput').files[0]; if (!file) return; const r = new FileReader(); r.onload = e => { localStorage.setItem('panzz_pic_'+currentUser.username, e.target.result); document.getElementById('profilePicPreview').src = e.target.result; const ep = document.getElementById('editProfilePicPreview'); if (ep) ep.src = e.target.result; updateUI(); }; r.readAsDataURL(file); }
        function changeUsername() {
            if (!isLoggedIn()) return; const newUser = document.getElementById('editUsername').value.trim();
            if (!newUser) return alert('Masukkan username baru!'); if (users[newUser]) return alert('Username sudah dipakai!');
            const last = parseInt(localStorage.getItem('panzz_username_change_'+currentUser.username)||'0');
            if (Date.now()-last < 86400000) { alert('1x/24 jam!'); return; }
            users[newUser] = { pass: currentUser.pass }; delete users[currentUser.username]; db.ref('users').set(users);
            localStorage.setItem('panzz_username_change_'+newUser, Date.now().toString());
            currentUser.username = newUser; alert('Username diganti!'); updateUI();
        }
        function changePassword() {
            const old = document.getElementById('editOldPass').value.trim(), n = document.getElementById('editNewPass').value.trim(), c = document.getElementById('editConfirmPass').value.trim();
            if (!old||!n||!c) return alert('Isi semua!'); if (old !== currentUser.pass) return alert('Password lama salah!'); if (n !== c) return alert('Password baru tidak cocok!');
            users[currentUser.username].pass = n; db.ref('users').set(users); currentUser.pass = n; alert('Password diganti!'); updateUI();
        }
        function deleteAccount() {
            const pass = document.getElementById('deletePass').value.trim(); if (pass !== currentUser.pass) return alert('Password salah!'); if (!confirm('Yakin hapus akun?')) return;
            delete users[currentUser.username]; db.ref('users').set(users); addons = addons.filter(a => a.author !== currentUser.username); db.ref('addons').set(addons);
            savedAddons = savedAddons.filter(a => a.savedBy !== currentUser.username); localStorage.setItem('panzz_saved', JSON.stringify(savedAddons));
            currentUser = null; alert('Akun dihapus!'); updateUI();
        }
        function searchUser() {
            const q = document.getElementById('searchUserInput').value.trim(); if (!q) return alert('Masukkan username!'); if (!users[q]) return alert('Username tidak ditemukan!');
            const sp = localStorage.getItem('panzz_pic_'+q), pic = sp || 'https://placehold.co/80/4CAF50/white?text=👤', ua = addons.filter(a => a.author === q), td = ua.reduce((s,a) => s + (a.links||[]).length, 0);
            const iA = ADMIN_PASSWORDS.includes(users[q].pass), iC = (q === CREATOR_USERNAME && users[q].pass === CREATOR_PASSWORD);
            let html = `<img src="${pic}" class="profile-pic" /><h3>${q}</h3><p>${iC?'Creator':iA?'Admin':'User'}</p><p style="font-size:12px;">📦 ${ua.length} add-on | 📥 ${td} download</p>`;
            if (isCreator() && !iC) html += `<p><button class="card-btn delete" onclick="deleteUserAccount('${q}')">🗑️ Hapus Akun Ini</button></p>`;
            document.getElementById('profileContent').innerHTML = html;
        }
        function deleteUserAccount(username) {
            if (!isCreator() || username === CREATOR_USERNAME) return; if (!confirm('Yakin hapus '+username+'?')) return;
            delete users[username]; db.ref('users').set(users); addons = addons.filter(a => a.author !== username); db.ref('addons').set(addons);
            savedAddons = savedAddons.filter(a => a.savedBy !== username); localStorage.setItem('panzz_saved', JSON.stringify(savedAddons));
            alert('Akun '+username+' dihapus!'); document.getElementById('profileContent').innerHTML = '<p>Akun telah dihapus.</p>';
        }

        function updateUI() {
            if (isLoggedIn()) {
                const sp = localStorage.getItem('panzz_pic_'+currentUser.username);
                document.getElementById('authBtns').innerHTML = `${sp?`<img src="${sp}" class="profile-pic-small" />`:''}<span style="font-size:12px;font-weight:600;">${getTitle()==='Creator'?'👑':isAdmin()?'🛡️':''} ${currentUser.username}</span>`;
            } else {
                document.getElementById('authBtns').innerHTML = `<button class="auth-btn" onclick="openModal('signin')">Sign In</button><button class="auth-btn signup" onclick="openModal('signup')">Sign Up</button>`;
            }
            switchTab(currentTab);
        }

        updateUI();
    </script>
</body>
</html>
